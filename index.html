<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phomemo Print</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--tx:#1c1c1c;--mu:#6b6b6b;--ac:#1d1d1f;--ac-tx:#fff;--bd:#d8d8d4;--ok:#2e9e5b;--warn:#d98a1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#ececec;--mu:#9a9a9a;--ac:#f0f0f0;--ac-tx:#111;--bd:#3a3a3a}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#ececec;--mu:#9a9a9a;--ac:#f0f0f0;--ac-tx:#111;--bd:#3a3a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
button,label.btn{appearance:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 8px;font:inherit;text-align:center;cursor:pointer}
button.pri{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);width:100%;font-weight:600}
button:disabled{opacity:.4}
button.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
input[type=file]{display:none}
input[type=range]{width:100%}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:0 0 10px}
.dot.ok{background:var(--ok)}
.st{flex:1;font-size:14px}
.sl{margin:8px 0 0;font-size:14px}
.sl span{color:var(--mu)}
#out{display:none;width:100%;image-rendering:pixelated;background:#fff;border-radius:6px}
.mu{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Phomemo Print</h1>

<div class="card"><div class="row"><div class="dot" id="dot"></div><div class="st" id="st">Not connected</div><button id="conn" style="flex:0 0 auto;padding:9px 14px">Connect</button></div></div>

<div class="card">
<img id="out" alt="Black and white preview">
<p class="mu" id="hint">Take or choose a picture.</p>
<div class="row">
<label class="btn">Camera<input type="file" accept="image/*" capture="environment" id="cam"></label>
<label class="btn">Library<input type="file" accept="image/*" id="lib"></label>
</div>
</div>

<div class="card">
<div class="row" style="margin-bottom:6px"><button id="sDots" class="on">Dots</button><button id="sNorm">Normal</button></div>
<div class="sl">Brightness <span id="vB">0</span><input type="range" id="rB" min="-100" max="100" value="0"></div>
<div class="sl">Contrast <span id="vC">1.0</span><input type="range" id="rC" min="50" max="200" value="100"></div>
<div class="sl" id="tw" style="display:none">Black/white cut-off <span id="vT">128</span><input type="range" id="rT" min="0" max="255" value="128"></div>
<div class="sl"><label><input type="checkbox" id="inv"> Invert (white on black)</label></div>
</div>

<div class="card">
<button class="pri" id="print" disabled>Print</button>
<div class="row" style="margin-top:8px"><button id="save" disabled>Save image</button></div>
<p class="mu" id="note">To keep the picture, you can also press and hold it and choose Save to Photos.</p>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const W=384;
let style='dots',res=null,srcImg=null,ch=null,dev=null,done=false,busy=false,tmr=null;
const sl=ms=>new Promise(r=>setTimeout(r,ms));
const setSt=(t,ok)=>{$('st').textContent=t;$('dot').className='dot'+(ok?' ok':'')};
const refresh=()=>{$('print').disabled=!(ch&&res)||busy};

if(!navigator.bluetooth){setSt('Open this page in Bluefy (Safari blocks Bluetooth)');$('conn').disabled=true}

/* ---------- Bluetooth ---------- */
async function connect(){
  try{
    setSt('Choose your printer…');
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xff00,0xfee7,0xae30,0xaf30,0x18f0,0xffe0,0xfff0]});
    dev.addEventListener('gattserverdisconnected',()=>{ch=null;setSt('Disconnected');refresh()});
    setSt('Connecting…');
    const srv=await dev.gatt.connect();
    let svc;
    try{svc=await srv.getPrimaryService(0xff00)}catch(_){
      let found=[];
      try{found=(await srv.getPrimaryServices()).map(s=>s.uuid.slice(4,8))}catch(__){}
      srv.disconnect();
      throw new Error('This device has no ff00 service. Found: '+(found.join(', ')||'none')+'. Pick another device or send me this list.');
    }
    ch=await svc.getCharacteristic(0xff02);
    for(const u of [0xff01,0xff03]){
      try{
        const c=await svc.getCharacteristic(u);
        await c.startNotifications();
        c.addEventListener('characteristicvaluechanged',e=>{
          const b=new Uint8Array(e.target.value.buffer);
          for(let i=0;i+2<b.length;i++) if(b[i]===0x1a&&b[i+1]===0x0f&&b[i+2]===0x0c) done=true;
        });
      }catch(_){}
    }
    setSt('Connected to '+(dev.name||'printer'),true);
  }catch(e){ch=null;setSt('Could not connect: '+(e.message||e))}
  refresh();
}
const wr=d=>ch.writeValueWithoutResponse?ch.writeValueWithoutResponse(d):ch.writeValue(d);

async function doPrint(){
  if(!(ch&&res))return;
  busy=true;done=false;refresh();
  try{
    setSt('Preparing…',true);
    for(const s of [[0x1f,0x11,0x08],[0x1f,0x11,0x37,0x64],[0xaa,0xab,0xac,0x02],[0x1f,0x11,0x0b]]){
      await wr(new Uint8Array(s));await sl(60);
    }
    const wb=res.wb,h=res.h,body=new Uint8Array(14+res.data.length);
    body.set([0x1b,0x40,0x1f,0x11,0x02,0x02,0x1d,0x76,0x30,0x00,wb&255,wb>>8,h&255,h>>8]);
    body.set(res.data,14);
    for(let o=0;o<body.length;o+=180){
      await wr(body.slice(o,o+180));
      setSt('Sending… '+Math.floor(Math.min(o+180,body.length)*100/body.length)+'%',true);
      await sl(45);
    }
    setSt('Printing…',true);
    for(let i=0;i<80&&!done;i++)await sl(250);
    setSt(done?'Done ✓':'Finished (no confirmation from printer)',true);
    $('note').textContent='Printed. Use Save image (or press and hold the picture) to keep it.';
  }catch(e){setSt('Print failed: '+(e.message||e))}
  busy=false;refresh();
}

/* ---------- Image ---------- */
function load(f){
  if(!f)return;
  const im=new Image();
  im.onload=()=>{srcImg=im;process()};
  im.src=URL.createObjectURL(f);
}
function process(){
  if(!srcImg)return;
  const iw=srcImg.naturalWidth,ih=srcImg.naturalHeight;
  const h=Math.max(1,Math.min(2400,Math.round(ih*W/iw)));
  const c=document.createElement('canvas');c.width=W;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,W,h);x.drawImage(srcImg,0,0,W,h);
  const px=x.getImageData(0,0,W,h).data,n=W*h,g=new Float32Array(n);
  const B=+$('rB').value*2.55,C=+$('rC').value/100,T=+$('rT').value,inv=$('inv').checked;
  for(let i=0;i<n;i++){
    let v=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];
    v=(v-128)*C+128+B;v=v<0?0:v>255?255:v;
    g[i]=inv?255-v:v;
  }
  const blk=new Uint8Array(n);
  if(style==='norm'){for(let i=0;i<n;i++)blk[i]=g[i]<T?1:0}
  else for(let y=0;y<h;y++)for(let xx=0;xx<W;xx++){
    const i=y*W+xx,o=g[i],wh=o>=128,e=o-(wh?255:0);
    blk[i]=wh?0:1;
    if(xx+1<W)g[i+1]+=e*7/16;
    if(y+1<h){if(xx>0)g[i+W-1]+=e*3/16;g[i+W]+=e*5/16;if(xx+1<W)g[i+W+1]+=e/16}
  }
  const wb=W/8,data=new Uint8Array(wb*h),oc=document.createElement('canvas');
  oc.width=W;oc.height=h;
  const ox=oc.getContext('2d'),od=ox.createImageData(W,h);
  for(let y=0;y<h;y++)for(let xx=0;xx<W;xx++){
    const i=y*W+xx,k=i*4,b=blk[i];
    if(b)data[y*wb+(xx>>3)]|=0x80>>(xx&7);
    const v=b?0:255;od.data[k]=od.data[k+1]=od.data[k+2]=v;od.data[k+3]=255;
  }
  ox.putImageData(od,0,0);
  res={data,wb,h,canvas:oc};
  const out=$('out');out.src=oc.toDataURL('image/png');out.style.display='block';$('hint').style.display='none';
  refresh();$('save').disabled=false;
}
const later=()=>{clearTimeout(tmr);tmr=setTimeout(process,120)};

async function save(){
  if(!res)return;
  res.canvas.toBlob(async b=>{
    const f=new File([b],'phomemo-bw.png',{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
    }catch(_){}
    $('note').textContent='Press and hold the picture above, then choose Save to Photos.';
  },'image/png');
}

/* ---------- Wiring ---------- */
$('conn').onclick=connect;
$('print').onclick=doPrint;
$('save').onclick=save;
$('cam').onchange=e=>load(e.target.files[0]);
$('lib').onchange=e=>load(e.target.files[0]);
$('sDots').onclick=()=>{style='dots';$('sDots').className='on';$('sNorm').className='';$('tw').style.display='none';process()};
$('sNorm').onclick=()=>{style='norm';$('sNorm').className='on';$('sDots').className='';$('tw').style.display='block';process()};
$('rB').oninput=()=>{$('vB').textContent=$('rB').value;later()};
$('rC').oninput=()=>{$('vC').textContent=($('rC').value/100).toFixed(1);later()};
$('rT').oninput=()=>{$('vT').textContent=$('rT').value;later()};
$('inv').onchange=process;
</script>
</body>
</html>
