<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Photo Printer</title>
<style>
:root{
  --bg:#f7f3f4;--fg:#211c1e;--mut:#6f6468;--card:#fff;--line:#e2d8dc;
  --acc:#c23a6e;--accfg:#fff;--logbg:#161214;--logfg:#d9f5df;--err:#ff7b8a;--rx:#8fd3ff;--tx:#ffd98f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171214;--fg:#f1e9ec;--mut:#a89aa0;--card:#221b1e;--line:#3a2f34;--acc:#ff7aa8;--accfg:#2a0f1a;color-scheme:dark}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);flex:1;min-height:46px}
button.main{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#state{font-weight:600;margin:0 0 4px}
#hint{color:var(--mut);font-size:13px;margin:0}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin-top:8px}
#log{background:var(--logbg);color:var(--logfg);font:12px/1.35 ui-monospace,Menlo,monospace;border-radius:10px;padding:8px;
  height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
#log .err{color:var(--err)}#log .rx{color:var(--rx)}#log .tx{color:var(--tx)}#log .ok{font-weight:700}
.label{font-size:13px;color:var(--mut);margin:0 0 6px}
</style>
</head>
<body>
<h1>Cat Photo Printer</h1>
<p class="sub">Milestone 1 · BLE connect + debug console</p>

<div class="card">
  <p id="state">Disconnected</p>
  <p id="hint">Tap Connect, then pick your printer.</p>
  <div class="row" style="margin-top:10px">
    <button id="btnConnect" class="main">Connect</button>
    <button id="btnDisc" disabled>Disconnect</button>
  </div>
</div>

<div class="card">
  <p class="label">Debug console</p>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="row" style="margin-top:8px">
    <button id="btnCopy">Copy log</button>
    <button id="btnClear">Clear</button>
  </div>
</div>

<div class="card">
  <p class="label">Raw hex send (debug only)</p>
  <select id="wsel" aria-label="Writable characteristic"><option value="">No writable characteristic yet</option></select>
  <input id="hexin" placeholder="e.g. 01 02 ff" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row" style="margin-top:8px"><button id="btnSend" disabled>Send</button></div>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, kind){
  const d = document.createElement('div');
  if(kind) d.className = kind;
  d.textContent = new Date().toISOString().slice(11,23) + ' ' + msg;
  logEl.appendChild(d);
  while(logEl.childNodes.length > 600) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
const hex = dv => Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength))
  .map(b => b.toString(16).padStart(2,'0')).join(' ');
const short = u => u.slice(4,8);
function errStr(e){
  if(e instanceof Error) return e.name+': '+e.message;
  let j=''; try{ j=JSON.stringify(e, Object.getOwnPropertyNames(Object(e))); }catch(_){}
  return 'non-Error '+typeof e+' -> '+String(e)+' '+j;
}

/* ---------- BLE layer (printer-agnostic) ---------- */
// Candidate services requested up front; Web Bluetooth can only list services declared here.
const SERVICES = ['ae30','ae00','af30','ff00','ffe0','fff0','18f0','fee7','180a','180f']
  .map(s => '0000'+s+'-0000-1000-8000-00805f9b34fb');
const PROPS = ['read','write','writeWithoutResponse','notify','indicate'];
let dev = null, server = null, writable = [];

function setState(connected, text){
  $('state').textContent = text || (connected ? 'Connected' : 'Disconnected');
  $('btnConnect').disabled = connected;
  $('btnDisc').disabled = !connected;
  $('btnSend').disabled = !connected || !writable.length;
}

// UNVERIFIED guess from the advertised name only; confirm with the service/characteristic log.
function protocolHint(name){
  if(/^MXW01/i.test(name||'')) return 'Name looks MXW01-style (0x22 0x21 framing) — unverified.';
  if(/^(GB0[123]|GT01)/i.test(name||'')) return 'Name looks GB01-family (0x51 0x78 framing) — unverified.';
  return 'Protocol unknown from name "'+(name||'')+'". Paste the log so we can decide.';
}

async function connect(){
  if(!navigator.bluetooth){ log('Web Bluetooth is not available in this browser.','err'); return; }
  try{
    log('Requesting device…');
    dev = null;
    const attempts = [
      ['all + optionalServices', {acceptAllDevices:true, optionalServices:SERVICES}],
      ['all, no services',       {acceptAllDevices:true}]
    ];
    for(const [label, opts] of attempts){
      try{ log('Trying: '+label); dev = await navigator.bluetooth.requestDevice(opts); break; }
      catch(e){ log('Failed ('+label+'): '+errStr(e),'err'); if(e && e.name==='NotFoundError') throw e; }
    }
    if(!dev) throw new Error('requestDevice failed on all attempts');
    log('Selected: name="'+dev.name+'" id='+dev.id);
    $('hint').textContent = protocolHint(dev.name);
    log($('hint').textContent);
    dev.addEventListener('gattserverdisconnected', () => {
      log('GATT disconnected','err'); writable = []; fillWritable(); setState(false);
    });
    setState(false,'Connecting…');
    log('GATT connecting…');
    server = await dev.gatt.connect();
    log('GATT connected','ok');
    setState(true,'Connected: '+(dev.name||'unnamed'));
    await discover();
    setState(true,'Connected: '+(dev.name||'unnamed'));
  }catch(e){
    log(errStr(e),'err');
    setState(false);
  }
}

async function discover(){
  writable = [];
  let services = [];
  try{ services = await server.getPrimaryServices(); }
  catch(e){ log('getPrimaryServices failed: '+e.name+': '+e.message,'err'); }
  log('Services found: '+services.length);
  for(const s of services){
    log('SERVICE '+s.uuid);
    let chars = [];
    try{ chars = await s.getCharacteristics(); }
    catch(e){ log('  getCharacteristics failed: '+e.message,'err'); continue; }
    for(const c of chars){
      const p = PROPS.filter(k => c.properties[k]);
      log('  CHAR '+c.uuid+' ['+p.join(',')+']');
      if(c.properties.write || c.properties.writeWithoutResponse) writable.push({svc:s.uuid, c});
      if(c.properties.notify || c.properties.indicate){
        try{
          c.addEventListener('characteristicvaluechanged', ev => log('RX '+short(c.uuid)+': '+hex(ev.target.value),'rx'));
          await c.startNotifications();
          log('  notifications on for '+short(c.uuid));
        }catch(e){ log('  startNotifications '+short(c.uuid)+' failed: '+e.message,'err'); }
      }
    }
  }
  fillWritable();
  log('Discovery done.','ok');
}

function fillWritable(){
  const sel = $('wsel');
  sel.innerHTML = '';
  if(!writable.length){ sel.innerHTML = '<option value="">No writable characteristic yet</option>'; return; }
  writable.forEach((w,i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = short(w.svc)+' / '+short(w.c.uuid);
    sel.appendChild(o);
  });
  const ae01 = writable.findIndex(w => short(w.c.uuid) === 'ae01');
  if(ae01 >= 0) sel.value = ae01;
}

async function sendHex(){
  const w = writable[+$('wsel').value];
  if(!w){ log('No characteristic selected','err'); return; }
  const clean = $('hexin').value.replace(/0x/gi,'').replace(/[^0-9a-f]/gi,'');
  if(!clean || clean.length % 2){ log('Bad hex input','err'); return; }
  const bytes = new Uint8Array(clean.match(/../g).map(h => parseInt(h,16)));
  try{
    log('TX '+short(w.c.uuid)+': '+hex(bytes),'tx');
    if(w.c.properties.writeWithoutResponse && w.c.writeValueWithoutResponse) await w.c.writeValueWithoutResponse(bytes);
    else await w.c.writeValue(bytes);
    log('  write ok');
  }catch(e){ log('Write failed: '+e.name+': '+e.message,'err'); }
}

function disconnect(){
  if(dev && dev.gatt.connected){ log('Disconnecting…'); dev.gatt.disconnect(); }
}

async function copyLog(){
  const text = logEl.innerText;
  try{ await navigator.clipboard.writeText(text); log('Log copied.','ok'); return; }catch(e){}
  const r = document.createRange(); r.selectNodeContents(logEl);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  log('Clipboard blocked: log selected, use Copy from the iOS menu.','err');
}

/* ---------- wiring ---------- */
$('btnConnect').addEventListener('click', connect);   // must stay a direct user tap (iOS rule)
$('btnDisc').addEventListener('click', disconnect);
$('btnSend').addEventListener('click', sendHex);
$('btnCopy').addEventListener('click', copyLog);
$('btnClear').addEventListener('click', () => { logEl.textContent = ''; });

log('UA: '+navigator.userAgent);
log('Secure context: '+window.isSecureContext+' | Web Bluetooth: '+!!navigator.bluetooth);
</script>
</body>
</html>
