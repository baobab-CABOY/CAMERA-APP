<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zinester Print Lab</title>
<style>
:root{
  --bg:#f4efe6;--fg:#181512;--mut:#685f56;--card:#fffdf9;--line:#181512;
  --accent:#d9385a;--accent2:#1e5bd8;--ok:#15803d;--warn:#d97706;--danger:#dc2626;
  --logbg:#141210;--logfg:#d8f3dc;--err:#ff7b8a;--rx:#8fd3ff;--tx:#ffd98f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161412;--fg:#f2ece1;--mut:#a69c90;--card:#1f1c19;--line:#e5dec9;
    --accent:#ff5c7c;--accent2:#6ba4ff;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;
    --logbg:#0f0e0d;--logfg:#c9f2cf;--err:#ff7b8a;--rx:#8fd3ff;--tx:#ffd98f;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px));
}

/* Minimalist Top Status & BLE Camera Bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:10px;padding:6px 10px;background:var(--card);
  border:1.5px solid var(--line);border-radius:8px;box-shadow:2px 2px 0 var(--line);
}
.cam-sign{
  display:inline-flex;align-items:center;gap:7px;min-width:0;
}
.cam-badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--mut);
}
.cam-badge.ready{
  border-color:var(--ok);color:var(--ok);background:color-mix(in srgb, var(--ok) 12%, var(--bg));
}
.cam-badge.busy{
  border-color:var(--accent2);color:var(--accent2);background:color-mix(in srgb, var(--accent2) 12%, var(--bg));
}
.status-dot{
  width:8px;height:8px;border-radius:50%;background:var(--mut);flex-shrink:0;
}
.cam-badge.ready .status-dot{background:var(--ok)}
.cam-badge.busy .status-dot{background:var(--accent2)}

.telem-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.telem-chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;
  border:1.5px solid var(--line);background:var(--bg);font-size:11px;font-weight:700;
  color:var(--fg);min-height:28px;
}
.telem-chip.heat-stop{
  border-color:var(--danger);background:color-mix(in srgb, var(--danger) 18%, var(--bg));
  color:var(--danger);animation:pulse 1.1s infinite;
}
.telem-chip.heat-ok{opacity:.65;color:var(--mut)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.ble-btns{display:flex;gap:5px;flex-shrink:0}
button.micro{
  min-height:28px;width:30px;padding:0;flex:0 0 30px;border-radius:6px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--fg);
  font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:1.5px 1.5px 0 var(--line);
}
button.micro:active:not(:disabled){transform:translate(1px,1px);box-shadow:0.5px 0.5px 0 var(--line)}
button.micro:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}

.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:8px;
  padding:12px;margin-bottom:12px;box-shadow:3px 3px 0 var(--line);
}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{
  font:inherit;font-weight:700;padding:10px 12px;border-radius:6px;
  border:1.5px solid var(--line);background:var(--card);color:var(--fg);
  flex:1;min-height:42px;cursor:pointer;
}
button:active:not(:disabled){transform:translate(1px,1px)}
button.icon-only{font-size:18px;padding:8px;min-height:40px;line-height:1}
button.pill{flex:0 0 auto;font-size:11.5px;padding:6px 10px;min-height:30px;border-radius:999px}
button.pill.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.pill.cool-pill{border-color:var(--accent2);color:var(--accent2)}
button.pill.cool-pill.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{
  outline:2.5px solid var(--accent);outline-offset:2px;
}

/* Zinester Print CTA right below image */
button.zinester-print{
  width:100%;margin-top:10px;min-height:52px;padding:12px 16px;
  background:var(--accent);color:#fff;border:2px solid var(--line);border-radius:4px;
  box-shadow:4px 4px 0 var(--line);
  font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
button.zinester-print::before{content:"★";font-size:13px}
button.zinester-print::after{
  content:"58MM";font-size:10px;padding:2px 5px;border:1px solid #fff;border-radius:2px;letter-spacing:.04em;
}
button.zinester-print:active:not(:disabled){
  transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line);
}

input,select{
  font:inherit;width:100%;padding:9px 10px;border-radius:6px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--fg);margin-top:6px;
}
#log{
  background:var(--logbg);color:var(--logfg);font:11.5px/1.35 ui-monospace,Menlo,monospace;
  border-radius:6px;padding:8px;height:32vh;overflow:auto;white-space:pre-wrap;word-break:break-all;
  -webkit-user-select:text;user-select:text;border:1px solid var(--line);
}
#log .err{color:var(--err)}#log .rx{color:var(--rx)}#log .tx{color:var(--tx)}#log .ok{font-weight:700}
.label{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--mut);margin:0 0 8px;
}
[hidden]{display:none!important}
.stage{position:relative;width:100%}
#view{width:100%;display:block;background:#fff;border:1.5px solid var(--line);border-radius:4px;image-rendering:pixelated}
#vid,#slitCv{width:100%;display:block;border-radius:4px;background:#000;border:1.5px solid var(--line)}
input[type=range]{padding:0;border:0;background:none}
.sl{display:block;margin-top:10px;font-size:13px}.sl b{float:right;font-weight:700}
#info{color:var(--mut);font-size:11.5px;margin:6px 0 0}
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:4px;-webkit-overflow-scrolling:touch}
.hist{display:flex;gap:8px;overflow-x:auto;padding-top:4px;-webkit-overflow-scrolling:touch}
.hitem{
  flex:0 0 84px;border:1.5px solid var(--line);border-radius:6px;
  padding:4px;background:var(--bg);text-align:center;box-shadow:2px 2px 0 var(--line);
}
.hitem canvas{width:100%;height:76px;object-fit:contain;background:#fff;border-radius:3px;display:block;image-rendering:pixelated}
.hitem button{width:100%;margin-top:4px;padding:4px 2px;min-height:28px;font-size:11px;border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
summary.adv-sum{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;list-style:none}
summary.adv-sum::-webkit-details-marker{display:none}
summary.adv-sum::before{content:"▸ ";color:var(--accent)}
details[open] > summary.adv-sum::before{content:"▾ "}
.sub-box{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line)}
.booth-banner{
  margin-top:8px;padding:8px 10px;border-radius:6px;border:1.5px solid var(--accent);
  background:color-mix(in srgb, var(--accent) 12%, var(--bg));font-size:12px;font-weight:700;
  text-align:center;
}
</style>
</head>
<body>

<!-- Minimalist Top Bar: 35mm Cocked/Open Camera Sign + Heat Stop + Battery % + BLE Micro Buttons -->
<div class="topbar">
  <div class="cam-sign">
    <div id="camBadge" class="cam-badge" title="Disconnected — 35mm camera open">
      <span class="status-dot"></span>
      <!-- 35mm SLR/Rangefinder SVG: swaps between cocked/loaded & open/uncocked -->
      <svg id="camSvg" width="24" height="18" viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <!-- Wind lever (cocked = angled out, uncocked = flat) -->
        <path id="windLever" d="M20 4 L25 2" />
        <!-- Top plate & prism -->
        <path d="M4 6 H9 L11 3 H17 L19 6 H24 A2 2 0 0 1 26 8 V16 A2 2 0 0 1 24 18 H4 A2 2 0 0 1 2 16 V8 A2 2 0 0 1 4 6 Z" />
        <!-- Lens barrel -->
        <circle cx="14" cy="12" r="4.2" />
        <!-- Film advance / loaded indicator inside -->
        <circle id="filmDot" cx="6" cy="9.5" r="1.3" fill="currentColor" stroke="none" />
      </svg>
    </div>
  </div>

  <div class="telem-group">
    <span id="heatChip" class="telem-chip heat-ok" title="Printhead thermal state">
      <span id="heatIcon">♨</span><span id="heatTxt">OK</span>
    </span>
    <span id="batChip" class="telem-chip" title="Printer battery">
      <span>🔋</span><span id="batTxt">--%</span>
    </span>
    <div class="ble-btns">
      <button id="btnConnect" class="micro" title="Connect BLE" aria-label="Connect BLE">⏻</button>
      <button id="btnDisc" class="micro" title="Disconnect BLE" aria-label="Disconnect BLE" disabled>✕</button>
    </div>
  </div>
</div>

<!-- Capture, Preview & Zinester Print Button -->
<div class="card">
  <div class="stage">
    <video id="vid" playsinline muted autoplay hidden></video>
    <canvas id="slitCv" width="384" height="512" hidden></canvas>
    <canvas id="view" width="384" height="240"></canvas>
  </div>
  <p id="info">No photo yet.</p>
  <div id="boothStatus" class="booth-banner" hidden></div>

  <button id="btnPrint" class="zinester-print" disabled>Print photo</button>

  <div class="row" style="margin-top:10px">
    <button id="btnLive">Live</button>
    <button id="btnSelfie" title="Switch Front / Back Camera" aria-label="Switch Front / Back Camera">🤳</button>
    <button id="btnShot" hidden>Snap</button>
    <button id="btnSlit">Slit-Scan</button>
    <button id="btnSlitStop" hidden>Finish</button>
  </div>

  <!-- Camera app & Library on same line with simple icon -->
  <div class="row" style="margin-top:8px">
    <button id="btnCam">📷 Camera</button>
    <button id="btnLib">🖼 Library</button>
  </div>

  <!-- Rotate & Mirror on another line, just the icons -->
  <div class="row" style="margin-top:8px">
    <button id="btnRot" class="icon-only" title="Rotate 90°" aria-label="Rotate 90°">↻</button>
    <button id="btnFlip" class="icon-only" title="Mirror horizontal" aria-label="Mirror horizontal">⇄</button>
  </div>

  <div id="slitOpts" hidden style="margin-top:8px;padding-top:8px;border-top:1.5px dashed var(--line)">
    <div class="grid2">
      <label class="sl" style="margin-top:0">Slit Sweep
        <select id="slitDir">
          <option value="v">Vertical (Top → Down)</option>
          <option value="h">Horizontal (Left → Right)</option>
        </select>
      </label>
      <label class="sl" style="margin-top:0">Speed
        <select id="slitSpd">
          <option value="2">Normal (2 px)</option>
          <option value="1">Slow / Long (1 px)</option>
          <option value="4">Fast (4 px)</option>
        </select>
      </label>
    </div>
  </div>
  <input id="fCam" type="file" accept="image/*" capture="environment" hidden>
  <input id="fLib" type="file" accept="image/*" hidden>
</div>

<!-- Creative Look & Frame -->
<div class="card">
  <p class="label">Look &amp; Frame</p>

  <div class="presets" id="presetBar">
    <button type="button" class="pill active" data-look="natural">Natural</button>
    <button type="button" class="pill" data-look="portrait">High-Key Portrait</button>
    <button type="button" class="pill" data-look="xerox">Xerox</button>
    <button type="button" class="pill cool-pill" data-look="cool">❄ Cool (Giveaway)</button>
    <button type="button" class="pill" data-look="gameboy">Game Boy</button>
    <button type="button" class="pill" data-look="halftone">Halftone</button>
    <button type="button" class="pill" data-look="ascii">ASCII</button>
    <button type="button" class="pill" data-look="blueprint">Blueprint</button>
  </div>

  <div class="grid2" style="margin-top:6px">
    <label class="sl" style="margin-top:4px">Shader
      <select id="mode" aria-label="Render mode">
        <option value="atk">Atkinson (crisp contrast)</option>
        <option value="fs">Floyd-Steinberg (smooth)</option>
        <option value="stucki">Stucki (sharp detail)</option>
        <option value="bayer">Bayer 8×8 (retro grid)</option>
        <option value="gameboy">Game Boy 4-Shade (128px)</option>
        <option value="halftone">Halftone Comic Dots</option>
        <option value="lines">Engraved Scanlines</option>
        <option value="ascii">ASCII Text Matrix</option>
        <option value="soft">Soft Threshold</option>
      </select>
    </label>
    <label class="sl" style="margin-top:4px">Frame
      <select id="frame">
        <option value="none">Borderless Full Bleed</option>
        <option value="polaroid">Instant Film (Polaroid)</option>
        <option value="receipt">Bodega Receipt Slip</option>
        <option value="ticket">Cinema / Gallery Stub</option>
        <option value="film">35mm Sprocket Strip</option>
        <option value="stamp">Postage Stamp</option>
      </select>
    </label>
  </div>

  <div class="grid2">
    <input id="caption" placeholder="Caption / title text" maxlength="42">
    <select id="stampOpt">
      <option value="none">No date stamp</option>
      <option value="date">Date (YYYY.MM.DD)</option>
      <option value="datetime">Date + Time</option>
      <option value="sign">Caption only</option>
    </select>
  </div>

  <label class="sl" style="margin-top:8px"><input id="invert" type="checkbox" style="width:auto"> Invert black &amp; white</label>
  <label class="sl" style="margin-top:6px"><input id="printSim" type="checkbox" checked style="width:auto"> Thermal print preview (simulates dark ink spread)</label>

  <details style="margin-top:8px"><summary style="font-size:12.5px;font-weight:700;cursor:pointer">Tone &amp; Dither Sliders</summary>
    <label class="sl">Brightness <b id="brv"></b><input id="br" type="range" min="-100" max="100" value="20"></label>
    <label class="sl">Contrast <b id="ctv"></b><input id="ct" type="range" min="-100" max="100" value="-20"></label>
    <label class="sl">Gamma <b id="gmv"></b><input id="gm" type="range" min="0.5" max="2.5" step="0.05" value="1"></label>
    <label class="sl">Threshold <b id="thv"></b><input id="th" type="range" min="0" max="255" value="128"></label>
    <label class="sl">Softness (soft threshold) <b id="sfv"></b><input id="sf" type="range" min="0" max="100" value="60"></label>
  </details>
</div>

<!-- Phase 2: Multi-Shot Photo Booth, Sideways Banner & Multi-Strip Poster Slicer -->
<div class="card">
  <p class="label">Roll Layouts · Booth &amp; Strips</p>

  <!-- Photo Booth Sequence -->
  <div class="grid3">
    <select id="boothCount" aria-label="Booth shots">
      <option value="3">3-Shot Booth</option>
      <option value="4">4-Shot Booth</option>
    </select>
    <select id="boothDelay" aria-label="Booth countdown">
      <option value="2">2s Timer</option>
      <option value="3">3s Timer</option>
      <option value="1">1s Rapid</option>
    </select>
    <button id="btnBooth" type="button">📸 Booth</button>
  </div>

  <!-- Sideways Long Banner & Poster Strip Splitter -->
  <div class="grid2" style="margin-top:8px">
    <button id="btnBanner" type="button">↔ Sideways Banner</button>
    <select id="stripCount" aria-label="Poster strips">
      <option value="1">Poster: 1 Strip (384px)</option>
      <option value="2">Poster: 2 Strips (768px)</option>
      <option value="3">Poster: 3 Strips (1152px)</option>
      <option value="4">Poster: 4 Strips (1536px)</option>
    </select>
  </div>

  <div id="stripBar" class="row" style="margin-top:8px" hidden></div>
</div>

<!-- Reprint Queue -->
<div class="card">
  <div class="row" style="align-items:center;margin-bottom:6px">
    <p class="label" style="margin:0;flex:1">Recent Prints</p>
    <button id="btnClearHist" class="pill" style="flex:0">Clear</button>
  </div>
  <div class="hist" id="histList"><span style="color:var(--mut);font-size:12px">Printed bitmaps appear here for 1-tap reprints.</span></div>
</div>

<!-- Advanced Console -->
<div class="card">
  <details>
    <summary class="adv-sum">advanced console</summary>

    <div class="sub-box">
      <p class="label">Diagnostics &amp; Calibration</p>
      <div class="row">
        <button id="btnTest" disabled>Test pattern</button>
        <button id="btnStat" disabled>Status</button>
        <button id="btnProbe" disabled>Probe size</button>
      </div>
      <label class="sl">Intensity (0xA2 burn pulse) <b id="inv"></b><input id="inten" type="range" min="0" max="255" value="93"></label>
      <label class="sl">Cool pause between giveaway prints (sec) <b id="cpv"></b><input id="coolPause" type="range" min="0" max="15" step="1" value="0"></label>
      <label class="sl">CRC8 polynomial <select id="crcv"><option value="07">0x07 (PROTOCOL.md)</option><option value="31">0x31 (alt table)</option></select></label>
      <label class="sl">Request byte 3, hex <input id="rq3" value="30" autocomplete="off"></label>
      <label class="sl">Request byte 4 / mode, hex <input id="rq4" value="00" autocomplete="off"></label>
      <label class="sl">Bit order <select id="bits"><option value="lsb">LSB first</option><option value="msb">MSB first</option></select></label>
      <label class="sl">Pacing preset <select id="preset">
        <option value="48,25">Mac Chrome: 48 B / 25 ms</option>
        <option value="96,20">Bluefy E: 96 B / 20 ms</option>
        <option value="144,60">Bluefy A: 144 B / 60 ms</option>
        <option value="96,40">Bluefy B: 96 B / 40 ms</option>
        <option value="48,60">Bluefy D: 48 B / 60 ms</option>
        <option value="20,25">Old: 20 B / 25 ms</option>
      </select></label>
      <label class="sl">Chunk bytes <input id="chunk" type="number" value="20" min="20" max="240"></label>
      <label class="sl">Delay ms <input id="delay" type="number" value="25" min="0" max="100"></label>
      <label class="sl"><input id="rot180" type="checkbox" style="width:auto"> Rotate 180° when printing</label>
      <label class="sl"><input id="poll" type="checkbox" style="width:auto"> Poll status while printing</label>
      <label class="sl">Feed rows after image <input id="feed" type="number" value="40" min="0" max="200"></label>
    </div>

    <div class="sub-box">
      <p class="label">Debug Log</p>
      <div id="log" role="log" aria-live="polite"></div>
      <div class="row" style="margin-top:8px">
        <button id="btnCopy">Copy log</button>
        <button id="btnClear">Clear</button>
      </div>
    </div>

    <div class="sub-box">
      <p class="label">Raw Hex Send</p>
      <select id="wsel" aria-label="Writable characteristic"><option value="">No writable characteristic yet</option></select>
      <input id="hexin" placeholder="e.g. 01 02 ff" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row" style="margin-top:8px"><button id="btnSend" disabled>Send</button></div>
    </div>
  </details>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, kind){
  const d = document.createElement('div');
  if(kind) d.className = kind;
  d.textContent = new Date().toISOString().slice(11,23) + ' ' + msg;
  logEl.appendChild(d);
  while(logEl.childNodes.length > 600) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
const hex = dv => Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength))
  .map(b => b.toString(16).padStart(2,'0')).join(' ');
const short = u => { u = String(u).toLowerCase(); return u.length === 4 ? u : u.slice(4,8); };
function errStr(e){
  if(e instanceof Error) return e.name+': '+e.message;
  let j=''; try{ j=JSON.stringify(e, Object.getOwnPropertyNames(Object(e))); }catch(_){}
  return 'non-Error '+typeof e+' -> '+String(e)+' '+j;
}

/* ---------- BLE & 35mm Camera Status Bar ---------- */
const SERVICES = ['ae30','ae00','af30','ff00','ffe0','fff0','18f0','fee7','180a','180f']
  .map(s => '0000'+s+'-0000-1000-8000-00805f9b34fb');
const PRINTER_FILTERS = [
  {namePrefix: 'MXW01'},
  {namePrefix: 'GB0'},
  {namePrefix: 'GT01'},
  {namePrefix: 'CAT'},
  {namePrefix: 'PeriPage'}
];
const PROPS = ['read','write','writeWithoutResponse','notify','indicate'];
let dev = null, server = null, writable = [], catChars = {}, printing = false;
let overheated = false, lastBattery = null;

function updateCamSign(connected){
  const badge = $('camBadge');
  const lever = $('windLever');
  const filmDot = $('filmDot');
  badge.classList.remove('ready', 'busy');
  if(printing){
    badge.classList.add('busy');
    badge.title = 'Printing — 35mm shutter active';
    lever.setAttribute('d', 'M20 4 L26 6');
    filmDot.setAttribute('opacity', '1');
  } else if(connected){
    badge.classList.add('ready');
    badge.title = 'Connected — 35mm camera cocked & loaded';
    lever.setAttribute('d', 'M20 4 L25 1');
    filmDot.setAttribute('opacity', '1');
  } else {
    badge.title = 'Disconnected — 35mm camera open / uncocked';
    lever.setAttribute('d', 'M20 6 L26 6');
    filmDot.setAttribute('opacity', '0.25');
  }
}

function setHeatAlert(isHot, labelText){
  overheated = !!isHot;
  const chip = $('heatChip');
  const txt = $('heatTxt');
  if(overheated){
    chip.className = 'telem-chip heat-stop';
    txt.textContent = labelText || 'STOP/HOT';
    log('PRINTER OVERHEAT / STOP: '+txt.textContent,'err');
  } else {
    chip.className = 'telem-chip heat-ok';
    txt.textContent = 'OK';
  }
  updPrint();
}

function setBatteryPct(pct){

    lastBattery = pct;

function setState(connected){
  $('btnConnect').disabled = connected;
  $('btnDisc').disabled = !connected;
  $('btnSend').disabled = !connected || !writable.length;
  updateCamSign(connected);
  updPrint();
}

async function attachDevice(targetDev){
  dev = targetDev;
  dev.addEventListener('gattserverdisconnected', () => {
    log('GATT disconnected','err');
    writable = []; fillWritable();
    setState(false);
  });
  updateCamSign(false);
  server = await dev.gatt.connect();
  log('GATT connected: '+(dev.name||'unnamed'),'ok');
  setState(true);
  await discover();
  setState(true);
  if(catChars.ae01) getStatus().catch(()=>{});
}

async function autoReconnectKnown(){
  if(!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  try{
    const devices = await navigator.bluetooth.getDevices();
    if(!devices || !devices.length) return;
    devices.sort((a,b) => (/^MXW01/i.test(b.name||'') ? 1 : 0) - (/^MXW01/i.test(a.name||'') ? 1 : 0));
    const preferred = devices[0];
    if(preferred && (!dev || !dev.gatt || !dev.gatt.connected)){
      log('Auto-connecting to known device: '+(preferred.name||preferred.id));
      await attachDevice(preferred);
    }
  }catch(_){}
}

async function connect(){
  if(!navigator.bluetooth){ log('Web Bluetooth unavailable in this browser.','err'); return; }
  try{
    if(navigator.bluetooth.getDevices){
      const known = await navigator.bluetooth.getDevices().catch(()=>[]);
      const mx = known.find(d => /^MXW01/i.test(d.name||''));
      if(mx && (!dev || !dev.gatt || !dev.gatt.connected)){
        try{ await attachDevice(mx); return; }catch(_){}
      }
    }
    log('Requesting device (prioritizing MXW01 / cat printers)…');
    let picked = null;
    try{
      picked = await navigator.bluetooth.requestDevice({
        filters: PRINTER_FILTERS,
        optionalServices: SERVICES
      });
    }catch(e){
      if(e && e.name === 'NotFoundError'){
        log('Filtered scan cancelled/empty — opening full device list…');
      } else {
        log('Filter scan note: '+errStr(e));
      }
    }
    if(!picked){
      picked = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: SERVICES
      });
    }
    if(!picked) throw new Error('No device selected');
    log('Selected: "'+(picked.name||'unnamed')+'"');
    await attachDevice(picked);
  }catch(e){
    log(errStr(e),'err');
    setState(false);
  }
}

async function discover(){
  writable = []; catChars = {};
  let services = [];
  try{ services = await server.getPrimaryServices(); }
  catch(e){ log('getPrimaryServices failed: '+e.name+': '+e.message,'err'); }
  log('Services found: '+services.length);
  for(const s of services){
    log('SERVICE '+s.uuid);
    let chars = [];
    try{ chars = await s.getCharacteristics(); }
    catch(e){ log('  getCharacteristics failed: '+e.message,'err'); continue; }
    for(const c of chars){
      const p = PROPS.filter(k => c.properties[k]);
      log('  CHAR '+c.uuid+' ['+p.join(',')+']');
      if(c.properties.write || c.properties.writeWithoutResponse) writable.push({svc:s.uuid, c});
      if(short(s.uuid) === 'ae30') catChars[short(c.uuid)] = c;
      if((c.properties.notify || c.properties.indicate) && short(s.uuid) === 'ae30'){
        try{
          c.addEventListener('characteristicvaluechanged', ev => {
            log('RX '+short(c.uuid)+': '+hex(ev.target.value),'rx');
            onNotify(short(c.uuid), ev.target.value);
          });
          await c.startNotifications();
          log('  notifications on for '+short(c.uuid));
        }catch(e){ log('  startNotifications '+short(c.uuid)+' failed: '+e.message,'err'); }
      }
    }
  }
  fillWritable();
  log('Discovery done.','ok');
}

function fillWritable(){
  const sel = $('wsel');
  sel.innerHTML = '';
  if(!writable.length){ sel.innerHTML = '<option value="">No writable characteristic yet</option>'; return; }
  writable.forEach((w,i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = short(w.svc)+' / '+short(w.c.uuid);
    sel.appendChild(o);
  });
  const ae01 = writable.findIndex(w => short(w.c.uuid) === 'ae01');
  if(ae01 >= 0) sel.value = ae01;
}

async function sendHex(){
  const w = writable[+$('wsel').value];
  if(!w){ log('No characteristic selected','err'); return; }
  const clean = $('hexin').value.replace(/0x/gi,'').replace(/[^0-9a-f]/gi,'');
  if(!clean || clean.length % 2){ log('Bad hex input','err'); return; }
  const bytes = new Uint8Array(clean.match(/../g).map(h => parseInt(h,16)));
  try{
    log('TX '+short(w.c.uuid)+': '+hex(bytes),'tx');
    if(w.c.properties.writeWithoutResponse && w.c.writeValueWithoutResponse) await w.c.writeValueWithoutResponse(bytes);
    else await w.c.writeValue(bytes);
    log('  write ok');
  }catch(e){ log('Write failed: '+e.name+': '+e.message,'err'); }
}

function disconnect(){
  if(dev && dev.gatt && dev.gatt.connected){ log('Disconnecting…'); dev.gatt.disconnect(); }
  setState(false);
}

async function copyLog(){
  const text = logEl.innerText;
  try{ await navigator.clipboard.writeText(text); log('Log copied.','ok'); return; }catch(e){}
  const r = document.createRange(); r.selectNodeContents(logEl);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  log('Clipboard blocked: log selected, use Copy from the iOS menu.','err');
}

/* ---------- Creative Pipeline: Shaders, Thermal Preview Gain, Frames & Phase 2 Layouts ---------- */
const W = 384;
const KERNELS = {
  fs:[[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]],
  atk:[[1,0,1/8],[2,0,1/8],[-1,1,1/8],[0,1,1/8],[1,1,1/8],[0,2,1/8]],
  stucki:[[1,0,8/42],[2,0,4/42],[-2,1,2/42],[-1,1,4/42],[0,1,8/42],[1,1,4/42],[2,1,2/42],[-2,2,1/42],[-1,2,2/42],[0,2,4/42],[1,2,2/42],[2,2,1/42]]
};
const BAYER = (() => {
  let m = [0], n = 1;
  while(n < 8){
    const nm = new Array(4*n*n);
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
      const v = m[y*n+x];
      nm[y*2*n+x] = 4*v; nm[y*2*n+x+n] = 4*v+2; nm[(y+n)*2*n+x] = 4*v+3; nm[(y+n)*2*n+x+n] = 4*v+1;
    }
    m = nm; n *= 2;
  }
  return m;
})();
const ASCII_RAMP = ' .:-=+*#%@';

const view = $('view'), vid = $('vid'), slitCv = $('slitCv'), work = document.createElement('canvas');
let src = null, rot = 0, mirror = false, facing = 'environment', stream = null, last = null, raf = 0, lastUrl = null;
let slitActive = false, slitRaf = 0, slitPos = 0, slitAccum = null;
let posterStrips = [], activeStripIdx = 0, sidewaysBanner = false;

function getStampText(){

  const hh = String(d.getHours()).padStart(2,'0'), mi = String(d.getMinutes()).padStart(2,'0');
  if(opt === 'date') return cap ? `${cap} · ${yyyy}.${mm}.${dd}` : `${yyyy}.${mm}.${dd}`;

  if(opt === 'sign') return cap;
  return '';
}

function ditherGrayToMono(g, w, h, mode, t, sfVal){
  const mono = new Uint8Array(w * h);
  if(mode === 'gameboy'){
    const scale = 3, gw = Math.floor(w / scale), gh = Math.floor(h / scale);
    const small = new Float32Array(gw * gh);
    for(let gy = 0; gy < gh; gy++){
      for(let gx = 0; gx < gw; gx++){
        let sum = 0, cnt = 0;
        for(let dy = 0; dy < scale; dy++) for(let dx = 0; dx < scale; dx++){
          const sx = gx*scale + dx, sy = gy*scale + dy;
          if(sx < w && sy < h){ sum += g[sy*w + sx]; cnt++; }
        }
        const avg = (sum / cnt) + (128 - t);
        small[gy*gw + gx] = avg < 64 ? 0 : avg < 128 ? 85 : avg < 192 ? 170 : 255;
      }
    }
    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const gx = Math.min(gw - 1, Math.floor(x / scale));
        const gy = Math.min(gh - 1, Math.floor(y / scale));
        const val = small[gy*gw + gx];
        const b = (BAYER[(y&7)*8 + (x&7)] + 0.5) * 4;
        mono[y*w + x] = val < b ? 1 : 0;
      }
    }
    return mono;
  }

  if(mode === 'halftone'){
    const freq = 0.92;
    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const u = x * 0.866 - y * 0.5;
        const v = x * 0.5 + y * 0.866;
        const spot = (Math.sin(u * freq) * Math.sin(v * freq) + 1) * 127.5;
        const lum = g[y*w + x] + (128 - t);
        mono[y*w + x] = lum < spot ? 1 : 0;
      }
    }
    return mono;
  }

  if(mode === 'lines'){
    const pitch = 4;
    for(let y = 0; y < h; y++){
      const phase = Math.abs((y % pitch) - (pitch - 1) / 2) / (pitch / 2);
      for(let x = 0; x < w; x++){
        const lum = Math.max(0, Math.min(255, g[y*w + x] + (128 - t)));
        const darkness = 1 - lum / 255;
        mono[y*w + x] = darkness > phase * 0.95 ? 1 : 0;
      }
    }
    return mono;
  }

  if(mode === 'ascii'){
    const cw = 6, ch = 8, cols = Math.floor(w / cw), rows = Math.floor(h / ch);
    const ac = document.createElement('canvas'); ac.width = w; ac.height = h;
    const ctx = ac.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#000'; ctx.font = 'bold 8px monospace'; ctx.textBaseline = 'top';
    for(let r = 0; r < rows; r++){
      let line = '';
      for(let c = 0; c < cols; c++){
        let sum = 0, cnt = 0;
        for(let dy = 0; dy < ch; dy++) for(let dx = 0; dx < cw; dx++){
          const sx = c*cw + dx, sy = r*ch + dy;
          if(sx < w && sy < h){ sum += g[sy*w + sx]; cnt++; }
        }
        const lum = Math.max(0, Math.min(255, (sum / cnt) + (128 - t)));
        const idx = Math.min(ASCII_RAMP.length - 1, Math.floor((1 - lum / 255) * ASCII_RAMP.length));
        line += ASCII_RAMP[idx];
      }
      ctx.fillText(line, 0, r * ch);
    }
    const d = ctx.getImageData(0, 0, w, h).data;
    for(let i = 0; i < w*h; i++) mono[i] = d[i*4] < 160 ? 1 : 0;
    return mono;
  }

  const K = KERNELS[mode];
  const band = 8 + sfVal * 1.2;
  const add = (x,y,e) => { if(x >= 0 && x < w && y < h) g[y*w+x] += e; };
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      const i = y*w + x, old = g[i];
      if(mode === 'soft'){
        let sv = (old - (t - band)) / (2*band); sv = sv < 0 ? 0 : sv > 1 ? 1 : sv; sv = sv*sv*(3 - 2*sv);
        const n = (52.9829189 * ((0.06711056*x + 0.00583715*y) % 1)) % 1;
        mono[i] = sv > n ? 0 : 1; continue;
      }
      if(mode === 'bayer'){
        mono[i] = old < (BAYER[(y&7)*8 + (x&7)] + 0.5) * 3.984375 + (t - 128) ? 1 : 0;
        continue;
      }
      const nw = old < t ? 0 : 255, e = old - nw;
      mono[i] = nw === 0 ? 1 : 0;
      for(const k of K) add(x+k[0], y+k[1], e*k[2]);
    }
  }
  return mono;
}

function composeWithFrame(photoMono, pw, ph){
  const frame = $('frame').value;
  const stamp = getStampText();
  const cap = $('caption').value.trim();

  let padTop = 0, padSide = 0, padBot = 0;
  if(frame === 'polaroid'){ padTop = 18; padSide = 18; padBot = 68; }
  else if(frame === 'receipt'){ padTop = 58; padSide = 16; padBot = 66; }
  else if(frame === 'ticket'){ padTop = 44; padSide = 20; padBot = 54; }
  else if(frame === 'film'){ padTop = 18; padSide = 34; padBot = 18; }
  else if(frame === 'stamp'){ padTop = 22; padSide = 22; padBot = 36; }
  else if(stamp){ padBot = 28; }

  const outW = W;
  const innerW = outW - padSide * 2;
  const innerH = Math.round(ph * (innerW / pw));
  const outH = Math.min(2400, padTop + innerH + padBot);

  const fc = document.createElement('canvas');
  fc.width = outW; fc.height = outH;
  const ctx = fc.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, outW, outH);

  ctx.fillStyle = '#000';
  ctx.strokeStyle = '#000';

  if(frame === 'film'){
    ctx.fillRect(0, 0, outW, outH);
    ctx.fillStyle = '#fff';
    for(let y = 10; y < outH - 12; y += 26){
      ctx.fillRect(8, y, 14, 16);
      ctx.fillRect(outW - 22, y, 14, 16);
    }
    ctx.font = 'bold 11px monospace';
    ctx.fillText('KODAK TRI-X 400  ▶ 14A', padSide, 13);
    if(stamp) ctx.fillText(stamp, padSide, outH - 6);
  }

  if(frame === 'receipt'){
    ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
    ctx.fillText('★ ZINESTER THERMAL LAB ★', outW/2, 22);
    ctx.font = '11px monospace';
    ctx.fillText('ITEM: MEMORY CAPTURE   QTY: 01', outW/2, 38);
    ctx.fillText('------------------------------------------', outW/2, 50);
  }

  if(frame === 'ticket'){
    ctx.lineWidth = 3;
    ctx.strokeRect(8, 8, outW - 16, outH - 16);
    ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
    ctx.fillText('ADMIT ONE · LIVE PRINT', 18, 28);
    ctx.textAlign = 'right';
    ctx.fillText('#042', outW - 18, 28);
    ctx.setLineDash([5, 5]); ctx.beginPath();
    ctx.moveTo(8, outH - padBot + 8); ctx.lineTo(outW - 8, outH - padBot + 8); ctx.stroke();
    ctx.setLineDash([]);
  }

  if(frame === 'stamp'){
    ctx.lineWidth = 2;
    ctx.strokeRect(14, 14, outW - 28, outH - 28);
    for(let x = 0; x <= outW; x += 16){ ctx.beginPath(); ctx.arc(x, 0, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x, outH, 5, 0, Math.PI*2); ctx.fill(); }
    for(let y = 0; y <= outH; y += 16){ ctx.beginPath(); ctx.arc(0, y, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(outW, y, 5, 0, Math.PI*2); ctx.fill(); }
  }

  const pc = document.createElement('canvas'); pc.width = pw; pc.height = ph;
  const pid = pc.getContext('2d').createImageData(pw, ph);
  for(let i = 0, j = 0; i < photoMono.length; i++, j += 4){
    const v = photoMono[i] ? 0 : 255;
    pid.data[j] = pid.data[j+1] = pid.data[j+2] = v; pid.data[j+3] = 255;
  }
  pc.getContext('2d').putImageData(pid, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pc, padSide, padTop, innerW, innerH);

  if(frame === 'polaroid'){
    ctx.lineWidth = 2;
    ctx.strokeRect(padSide - 1, padTop - 1, innerW + 2, innerH + 2);
    ctx.font = 'bold 20px Georgia, serif'; ctx.textAlign = 'center';
    const label = cap || stamp || '';
    if(label) ctx.fillText(label, outW/2, outH - 26);
    if(cap && stamp && cap !== stamp){
      ctx.font = '11px monospace';
      ctx.fillText(stamp, outW/2, outH - 10);
    }
  } else if(frame === 'receipt'){
    ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('------------------------------------------', outW/2, outH - 50);
    ctx.fillText(stamp || 'THANK YOU FOR VISITING', outW/2, outH - 36);
    let bx = 72;
    for(let i = 0; i < 48; i++){
      const bw = ((i * 7 + 3) % 3) + 1;
      if(i % 2 === 0) ctx.fillRect(bx, outH - 28, bw, 18);
      bx += bw + 2;
    }
  } else if(frame === 'ticket'){
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(stamp || 'KEEP THIS STUB · THERMAL LAB', outW/2, outH - 20);
  } else if(frame === 'stamp'){
    ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
    ctx.fillText(stamp || 'POSTES · 58MM', 22, outH - 16);
    ctx.textAlign = 'right';
    ctx.fillText('1ST CLASS', outW - 22, outH - 16);
  } else if(frame === 'none' && stamp){
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'right';
    ctx.fillText(stamp, outW - 8, outH - 9);
  }

  const outId = ctx.getImageData(0, 0, outW, outH).data;
  const outMono = new Uint8Array(outW * outH);
  const inv = $('invert').checked;
  for(let i = 0; i < outMono.length; i++){
    const black = outId[i*4] < 128 ? 1 : 0;
    outMono[i] = inv ? (black ^ 1) : black;
  }
  return {mono: outMono, w: outW, h: outH};
}

function applyThermalPreviewGain(mono, w, h){
  const sim = new Uint8Array(mono);
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      if(mono[y*w + x]){
        if(x + 1 < w) sim[y*w + (x + 1)] = 1;
        if(y + 1 < h && ((x + y) & 1) === 0) sim[(y + 1)*w + x] = 1;
      }
    }
  }
  return sim;
}

function buildPosterStrips(finalImg, numStrips){
  posterStrips = [];
  activeStripIdx = 0;
  const bar = $('stripBar');
  if(numStrips <= 1){
    bar.hidden = true;
    return finalImg;
  }
  const fullW = W * numStrips;
  const fullH = Math.min(2200, Math.round(finalImg.h * numStrips));
  const fullCv = document.createElement('canvas'); fullCv.width = fullW; fullCv.height = fullH;
  const fctx = fullCv.getContext('2d');
  fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, fullW, fullH);

  const srcCv = document.createElement('canvas'); srcCv.width = finalImg.w; srcCv.height = finalImg.h;
  const sid = srcCv.getContext('2d').createImageData(finalImg.w, finalImg.h);
  for(let i = 0, j = 0; i < finalImg.mono.length; i++, j += 4){
    const v = finalImg.mono[i] ? 0 : 255;
    sid.data[j] = sid.data[j+1] = sid.data[j+2] = v; sid.data[j+3] = 255;
  }
  srcCv.getContext('2d').putImageData(sid, 0, 0);
  fctx.imageSmoothingEnabled = false;
  fctx.drawImage(srcCv, 0, 0, fullW, fullH);

  for(let s = 0; s < numStrips; s++){
    const scv = document.createElement('canvas'); scv.width = W; scv.height = fullH;
    const sctx = scv.getContext('2d');
    sctx.fillStyle = '#fff'; sctx.fillRect(0, 0, W, fullH);
    sctx.drawImage(fullCv, s * W, 0, W, fullH, 0, 0, W, fullH);
    sctx.fillStyle = '#000';
    sctx.font = 'bold 10px monospace';
    sctx.fillText(`STRIP ${s+1}/${numStrips}  [TAPE HERE]`, 8, 12);
    sctx.fillRect(0, 0, 12, 2); sctx.fillRect(W - 12, 0, 12, 2);
    sctx.fillRect(0, fullH - 2, 12, 2); sctx.fillRect(W - 12, fullH - 2, 12, 2);

    const sd = sctx.getImageData(0, 0, W, fullH).data;
    const sm = new Uint8Array(W * fullH);
    for(let i = 0; i < sm.length; i++) sm[i] = sd[i*4] < 128 ? 1 : 0;
    posterStrips.push({mono: sm, w: W, h: fullH});
  }

  bar.hidden = false;
  bar.innerHTML = '';
  posterStrips.forEach((_, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill' + (idx === 0 ? ' active' : '');
    b.textContent = `Strip ${idx+1}`;
    b.addEventListener('click', () => {
      activeStripIdx = idx;
      bar.querySelectorAll('button').forEach((el, k) => el.classList.toggle('active', k === idx));
      renderBitmapToView(posterStrips[idx], `Poster Strip ${idx+1}/${numStrips}`);
    });
    bar.appendChild(b);
  });
  return posterStrips[0];
}

function renderBitmapToView(imgObj, tagNote){
  const useSim = $('printSim').checked;
  const dispMono = useSim ? applyThermalPreviewGain(imgObj.mono, imgObj.w, imgObj.h) : imgObj.mono;
  const outId = new ImageData(imgObj.w, imgObj.h);
  for(let i = 0, j = 0; i < dispMono.length; i++, j += 4){
    const isBlack = dispMono[i] === 1;
    outId.data[j]   = isBlack ? 24  : 250;
    outId.data[j+1] = isBlack ? 20  : 246;
    outId.data[j+2] = isBlack ? 18  : 238;
    outId.data[j+3] = 255;
  }
  view.width = imgObj.w; view.height = imgObj.h;
  view.getContext('2d').putImageData(outId, 0, 0);
  last = imgObj;
  updPrint();
  $('info').textContent = imgObj.w+' × '+imgObj.h+' px · '+Math.round(imgObj.h/8)+' mm'+(tagNote ? ' · '+tagNote : '');
}

function draw(){
  ['br','ct','gm','th','sf'].forEach(k => { $(k+'v').textContent = $(k).value; });
  if(!src) return;
  const extraRot = sidewaysBanner ? 1 : 0;
  const totalRot = (rot + extraRot) % 4;
  const odd = totalRot % 2 === 1;
  const sw = odd ? src.h : src.w, sh = odd ? src.w : src.h;
  const H = Math.min(2200, Math.max(8, Math.round(W * sh / sw)));
  work.width = W; work.height = H;
  const c = work.getContext('2d', {willReadFrequently:true});
  c.fillStyle = '#fff'; c.fillRect(0,0,W,H);
  c.save();
  c.translate(W/2, H/2);
  if(mirror) c.scale(-1, 1);
  c.rotate(totalRot * Math.PI / 2);
  const dw = odd ? H : W, dh = odd ? W : H;
  c.drawImage(src.el, -dw/2, -dh/2, dw, dh);
  c.restore();

  const id = c.getImageData(0,0,W,H), d = id.data, g = new Float32Array(W*H);
  const br = +$('br').value * 2.55, ct = +$('ct').value * 2.55, gm = +$('gm').value, t = +$('th').value;
  const cf = (259 * (ct + 255)) / (255 * (259 - ct));
  for(let i = 0, j = 0; i < g.length; i++, j += 4){
    let v = 0.299*d[j] + 0.587*d[j+1] + 0.114*d[j+2] + br;
    v = cf * (v - 128) + 128;
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    g[i] = 255 * Math.pow(v / 255, 1 / gm);
  }

  const photoMono = ditherGrayToMono(g, W, H, $('mode').value, t, +$('sf').value);
  const finalImg = composeWithFrame(photoMono, W, H);
  const strips = +$('stripCount').value || 1;
  const chosen = buildPosterStrips(finalImg, strips);
  renderBitmapToView(chosen, sidewaysBanner ? 'Sideways Banner' : '');
}

function stopCam(){
  slitActive = false;
  cancelAnimationFrame(slitRaf);
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  vid.srcObject = null; vid.hidden = true; slitCv.hidden = true; view.hidden = false;
  $('btnShot').hidden = true; $('btnSlitStop').hidden = true; $('slitOpts').hidden = true;
  $('btnLive').textContent = 'Live'; $('btnSlit').textContent = 'Slit-Scan';
}

async function startCam(forSlit){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    log('Live camera unavailable here (needs HTTPS). Use Camera or Library.','err'); return false;
  }
  try{
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    log('Starting '+facing+' camera…');
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:960}},
      audio:false
    });
    vid.srcObject = stream; await vid.play();
    if(!forSlit){
      vid.hidden = false; slitCv.hidden = true; view.hidden = true;
      $('btnShot').hidden = false; $('btnLive').textContent = 'Stop';
    }
    log('Camera on ('+facing+'): '+vid.videoWidth+'×'+vid.videoHeight,'ok');
    return true;
  }catch(e){ log('Camera failed: '+errStr(e),'err'); stopCam(); return false; }
}

async function toggleSelfie(){
  facing = facing === 'environment' ? 'user' : 'environment';
  mirror = (facing === 'user');
  $('fCam').setAttribute('capture', facing);
  log('Camera switched to '+(facing === 'user' ? 'selfie (front)' : 'rear'));

function grabFrameCanvas(){
  const w = vid.videoWidth, h = vid.videoHeight;
  if(!w) return null;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(vid, 0, 0);
  return c;
}

function shot(){

  src = {el:c, w:c.width, h:c.height}; rot = 0; stopCam(); draw();

async function runPhotoBooth(){
  const count = +$('boothCount').value || 3;
  const sec = +$('boothDelay').value || 2;
  const banner = $('boothStatus');
  if(!stream){
    const ok = await startCam(false);
    if(!ok) return;
  }
  banner.hidden = false;
  const frames = [];
  for(let k = 1; k <= count; k++){
    for(let s = sec; s > 0; s--){
      banner.textContent = `Pose ${k}/${count} in ${s}…`;
      await new Promise(r => setTimeout(r, 1000));
    }
    banner.textContent = `Snap ${k}/${count}!`;
    const snap = grabFrameCanvas();
    if(snap) frames.push(snap);
    await new Promise(r => setTimeout(r, 350));
  }
  banner.hidden = true;
  stopCam();
  if(!frames.length){ log('Photo booth captured no frames','err'); return; }

  const pad = 14, cellW = W - pad * 2, cellH = Math.round(cellW * 0.75);
  const stripH = pad + frames.length * (cellH + pad) + 28;
  const bcv = document.createElement('canvas'); bcv.width = W; bcv.height = stripH;
  const bctx = bcv.getContext('2d');
  bctx.fillStyle = '#fff'; bctx.fillRect(0, 0, W, stripH);
  bctx.fillStyle = '#000';
  frames.forEach((f, idx) => {
    const y = pad + idx * (cellH + pad);
    bctx.strokeRect(pad - 1, y - 1, cellW + 2, cellH + 2);
    bctx.save();
    bctx.beginPath(); bctx.rect(pad, y, cellW, cellH); bctx.clip();
    if(mirror){ bctx.translate(W, 0); bctx.scale(-1, 1); }
    const scale = Math.max(cellW / f.width, cellH / f.height);
    const dw = f.width * scale, dh = f.height * scale;
    const dx = mirror ? (W - pad - cellW + (cellW - dw)/2) : (pad + (cellW - dw)/2);
    bctx.drawImage(f, dx, y + (cellH - dh)/2, dw, dh);
    bctx.restore();
  });
  bctx.font = 'bold 12px monospace'; bctx.textAlign = 'center';
  bctx.fillText(`PHOTO BOOTH ×${frames.length} · ${new Date().toLocaleDateString()}`, W/2, stripH - 10);

  sidewaysBanner = false;
  src = {el: bcv, w: W, h: stripH}; rot = 0;
  draw();
  log('Photo booth strip ready ('+frames.length+' frames)','ok');
}

async function startSlitScan(){
  if(slitActive){ finishSlitScan(); return; }
  if(!stream){
    const ok = await startCam(true);
    if(!ok) return;
  }
  const dir = $('slitDir').value;
  const sw = 384, sh = dir === 'v' ? 576 : 384;
  slitCv.width = sw; slitCv.height = sh;
  const ctx = slitCv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, sw, sh);

  slitAccum = document.createElement('canvas');
  slitAccum.width = sw; slitAccum.height = sh;
  slitAccum.getContext('2d').fillStyle = '#fff';
  slitAccum.getContext('2d').fillRect(0, 0, sw, sh);

  slitPos = 0; slitActive = true;
  vid.hidden = true; view.hidden = true; slitCv.hidden = false;
  $('btnShot').hidden = true; $('btnSlitStop').hidden = false; $('slitOpts').hidden = false;
  $('btnSlit').textContent = 'Cancel';

  const tmp = document.createElement('canvas'); tmp.width = sw; tmp.height = sh;
  const tctx = tmp.getContext('2d');
  const actx = slitAccum.getContext('2d');

  const tick = () => {
    if(!slitActive) return;
    const spd = +$('slitSpd').value || 2;
    const vw = vid.videoWidth || 640, vh = vid.videoHeight || 480;
    const scale = Math.max(sw / vw, sh / vh);
    const dw = vw * scale, dh = vh * scale;
    tctx.save();
    if(mirror){ tctx.translate(sw, 0); tctx.scale(-1, 1); }
    tctx.drawImage(vid, (sw - dw)/2, (sh - dh)/2, dw, dh);
    tctx.restore();

    if(dir === 'v'){
      actx.drawImage(tmp, 0, slitPos, sw, spd, 0, slitPos, sw, spd);
      ctx.drawImage(tmp, 0, 0);
      ctx.drawImage(slitAccum, 0, 0, sw, slitPos + spd, 0, 0, sw, slitPos + spd);
      ctx.fillStyle = '#ff3b7f'; ctx.fillRect(0, slitPos + spd, sw, 3);
      slitPos += spd;
      if(slitPos >= sh){ finishSlitScan(); return; }
    } else {
      actx.drawImage(tmp, slitPos, 0, spd, sh, slitPos, 0, spd, sh);
      ctx.drawImage(tmp, 0, 0);
      ctx.drawImage(slitAccum, 0, 0, slitPos + spd, sh, 0, 0, slitPos + spd, sh);
      ctx.fillStyle = '#ff3b7f'; ctx.fillRect(slitPos + spd, 0, 3, sh);
      slitPos += spd;
      if(slitPos >= sw){ finishSlitScan(); return; }
    }
    slitRaf = requestAnimationFrame(tick);
  };
  slitRaf = requestAnimationFrame(tick);
}

function finishSlitScan(){
  if(!slitAccum) return;
  const dir = $('slitDir').value;
  const finalH = Math.max(48, dir === 'v' ? Math.min(slitAccum.height, slitPos || slitAccum.height) : slitAccum.height);
  const finalW = Math.max(48, dir === 'h' ? Math.min(slitAccum.width, slitPos || slitAccum.width) : slitAccum.width);
  const out = document.createElement('canvas'); out.width = finalW; out.height = finalH;
  out.getContext('2d').drawImage(slitAccum, 0, 0, finalW, finalH, 0, 0, finalW, finalH);
  sidewaysBanner = false;
  src = {el: out, w: finalW, h: finalH};
  rot = 0; stopCam(); draw();
  log('Slit-Scan captured ('+finalW+'×'+finalH+')','ok');
}

/* ---------- printer driver: MXW01 ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function crc8(arr){ const poly = $('crcv').value === '31' ? 0x31 : 0x07; let c = 0; for(const b of arr){ c ^= b; for(let i = 0; i < 8; i++) c = (c & 0x80) ? ((c << 1) ^ poly) & 0xff : (c << 1) & 0xff; } return c; }
function pkt(cmd, payload){
  const p = Uint8Array.from(payload), n = p.length, o = new Uint8Array(8 + n);
  o.set([0x22,0x21,cmd,0x00,n & 255,n >> 8]); o.set(p,6); o[6+n] = crc8(p); o[7+n] = 0xFF; return o;
}
async function wr(ch, bytes){
  const b = new Uint8Array(bytes.length); b.set(bytes);
  if(ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) await ch.writeValueWithoutResponse(b);
  else await ch.writeValue(b);
}
let waiters = [], rxCount = 0;
function onNotify(id, dv){
  rxCount++;
  if(id !== 'ae02') return;
  const b = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  if(b.length < 8 || b[0] !== 0x22 || b[1] !== 0x21){ log('  (unparsed notify)'); return; }
  const cmd = b[2], n = b[4] | (b[5] << 8);
  const pl = b.subarray(6, 6+n);
  log('  RX cmd 0x'+cmd.toString(16)+' payload: '+hex(pl));
  if(cmd === 0xA1 && b.length >= 14){
    const st = decodeStatus(b);
    setBatteryPct(st.battery);
    if(st.flag || st.temp >= 60) setHeatAlert(true, st.temp >= 60 ? st.temp+'°C' : 'ERR '+st.err);
    else setHeatAlert(false);
  }
  if(cmd === 0xAA && pl.length >= 1){
    if(pl[0] === 0xfc || (pl[0] !== 0x00 && pl[0] !== 0x01)){
      setHeatAlert(true, 'STOP');
    }
  }
  waiters = waiters.filter(w => { if(w.cmd === cmd){ w.res(b); return false; } return true; });
}
function waitCmd(cmd, ms){
  return new Promise(res => {
    const w = {cmd, res}; waiters.push(w);
    setTimeout(() => { if(waiters.includes(w)){ waiters = waiters.filter(x => x !== w); res(null); } }, ms);
  });
}
function packRows(mono, w, h, lsb, rows){
  const rb = w >> 3, out = new Uint8Array(rb * rows);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++)
    if(mono[y*w+x]) out[y*rb + (x >> 3)] |= lsb ? (1 << (x & 7)) : (0x80 >> (x & 7));
  return out;
}
function decodeStatus(b){ return {state:b[6], battery:b[9], temp:b[10], flag:b[12], err:b[13]}; }
async function getStatus(){
  const c1 = catChars.ae01; if(!c1) return null;
  const w = waitCmd(0xA1, 3000), p = pkt(0xA1, [0x00]);
  log('TX ae01: '+hex(p),'tx'); await wr(c1, p);
  const r = await w;
  if(!r){ log('No status answer within 3 s','err'); return null; }
  const st = decodeStatus(r);
  setBatteryPct(st.battery);
  if(st.flag || st.temp >= 60) setHeatAlert(true, st.temp >= 60 ? st.temp+'°C' : 'ERR '+st.err);
  else setHeatAlert(false);
  log('Status: state '+st.state+', battery '+st.battery+'%, temp '+st.temp+'°C, flag '+st.flag+(st.flag ? ', error '+st.err : ' (OK)'), st.flag ? 'err' : 'ok');
  return st;
}
const catDriver = {
  name:'MXW01', widthPx:384,
  connect, disconnect,
  async printBitmap(mono, w, h){
    const c1 = catChars.ae01, c3 = catChars.ae03;
    if(!(dev && dev.gatt.connected && c1 && c3)) throw new Error('Not connected (need ae01 + ae03)');
    if(w !== 384) throw new Error('Width must be 384');
    let m = mono;
    if($('rot180').checked){ m = new Uint8Array(mono.length); for(let i = 0; i < mono.length; i++) m[i] = mono[mono.length - 1 - i]; }
    const rows = Math.max(h + (+$('feed').value | 0), 90);
    const lsb = $('bits').value === 'lsb';
    const data = packRows(m, w, h, lsb, rows);
    const ctl = async (cmd, pl) => { const p = pkt(cmd, pl); log('TX ae01: '+hex(p),'tx'); await wr(c1, p); };
    const ch = Math.max(20, +$('chunk').value | 0), dl = +$('delay').value | 0;
    log('Print start: '+w+' × '+rows+' rows, '+data.length+' bytes, '+(lsb ? 'LSB' : 'MSB')+' first, chunk '+ch+', delay '+dl+' ms');
    await ctl(0xA2, [+$('inten').value & 255]);
    await sleep(50);
    const st = await getStatus();
    if(st && (st.flag || st.temp >= 60)){
      setHeatAlert(true, st.temp >= 60 ? st.temp+'°C' : 'ERR '+st.err);
      throw new Error('Printer overheated / stopped (code '+st.err+', temp '+st.temp+'°C): wait for cooldown');
    }
    const r3 = parseInt($('rq3').value, 16) & 255, r4 = parseInt($('rq4').value, 16) & 255;
    const ack = waitCmd(0xA9, 3000);
    await ctl(0xA9, [rows & 255, rows >> 8, r3, r4]);
    const a = await ack;
    if(!a) throw new Error('No answer to print request: power-cycle the printer and reconnect');
    if(a[6] !== 0){
      setHeatAlert(true, 'BUSY/HOT');
      throw new Error('Print request rejected (code '+a[6]+').');
    }
    log('Print request accepted','ok');
    const rx0 = rxCount; let n = 0;
    for(let o = 0; o < data.length; o += ch, n++){
      await wr(c3, data.subarray(o, o + ch));
      if(dl) await sleep(dl);
      if(n % 150 === 0) log('  data '+Math.round(o * 100 / data.length)+'%');
    }
    log('Data sent: '+n+' writes. Printer messages during data phase: '+(rxCount - rx0), 'ok');
    const done = waitCmd(0xAA, 45000);
    await ctl(0xAD, [0x00]);
    let polling = $('poll').checked;
    (async () => { while(polling){ await sleep(3000); if(polling) await getStatus(); } })();
    const d = await done; polling = false;
    log(d ? 'Print complete (0xAA received)' : 'No complete notice within 45 s', d ? 'ok' : 'err');
    const cp = +$('coolPause').value || 0;
    if(cp > 0){
      log('Cool mode cooldown pause: '+cp+'s…','ok');
      await sleep(cp * 1000);
    }
  }
};

function testPattern(){
  const w = 384, h = 200, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.fillStyle = '#000';
  x.fillRect(0,0,w,6); x.fillRect(0,h-6,w,6); x.fillRect(0,0,6,h); x.fillRect(w-6,0,6,h); x.fillRect(12,12,28,28);
  x.fillRect(12, 140, w - 24, 40);
  x.font = 'bold 110px sans-serif'; x.textBaseline = 'top'; x.fillText('F', 70, 20);
  const d = x.getImageData(0,0,w,h).data, m = new Uint8Array(w*h);
  for(let i = 0; i < m.length; i++) m[i] = d[i*4] < 128 ? 1 : 0;
  return {mono:m, w, h};
}
function updPrint(){
  const ok = !!(dev && dev.gatt && dev.gatt.connected && catChars.ae01 && catChars.ae03) && !printing && !overheated;
  $('btnPrint').disabled = !ok || !last;
  $('btnTest').disabled = !ok; $('btnStat').disabled = !ok; $('btnProbe').disabled = !ok;
  updateCamSign(!!(dev && dev.gatt && dev.gatt.connected));
}
async function probeSize(){
  if(printing) return;
  printing = true; updPrint();
  try{
    const c1 = catChars.ae01, c3 = catChars.ae03;
    if(!(dev && dev.gatt.connected && c1 && c3)) throw new Error('Not connected');
    const t = testPattern(), rows = t.h, img = packRows(t.mono, t.w, t.h, true, rows), exp = img.length;
    const ctl = async (cmd, pl) => { const p = pkt(cmd, pl); log('TX ae01: '+hex(p),'tx'); await wr(c1, p); };
    const ch = 20, dl = +$('delay').value | 0, cap = exp * 4;
    log('PROBE: '+rows+' rows requested; streaming up to '+cap+' bytes.');
    await ctl(0xA2, [+$('inten').value & 255]); await sleep(50);
    const ack = waitCmd(0xA9, 3000);
    await ctl(0xA9, [rows & 255, rows >> 8, parseInt($('rq3').value, 16) & 255, parseInt($('rq4').value, 16) & 255]);
    if(!(await ack)) throw new Error('No answer to print request: power-cycle the printer');
    const rx0 = rxCount; let sent = 0;
    while(sent < cap && rxCount === rx0){
      const part = sent < exp ? img.subarray(sent, sent + ch) : new Uint8Array(ch);
      await wr(c3, part); sent += part.length;
      if(dl) await sleep(dl);
    }
    log(rxCount > rx0 ? 'Printer spoke after '+sent+' bytes' : 'No message after '+sent+' bytes', rxCount > rx0 ? 'ok' : 'err');
    await ctl(0xAD, [0x00]);
    await sleep(6000);
  }catch(e){ log('Probe failed: '+errStr(e),'err'); }
  printing = false; updPrint();
}
async function doPrint(m, isReprint){
  if(printing || overheated) return;
  printing = true; updPrint();
  try{
    if(!isReprint && m !== null && last === m) saveToHistory(m);
    await catDriver.printBitmap(m.mono, m.w, m.h);
  }
  catch(e){ log('Print failed: '+errStr(e),'err'); }
  printing = false; updPrint();
}
$('btnPrint').addEventListener('click', () => last && doPrint(last, false));
$('btnTest').addEventListener('click', () => doPrint(testPattern(), true));

$('inv').textContent = $('inten').value;
