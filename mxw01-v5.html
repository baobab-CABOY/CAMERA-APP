<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MXW01 Thermal Camera — v5</title>
<style>
:root{
  --bg:#f4f5f7;--fg:#181b20;--mut:#5f6672;--card:#ffffff;--line:#dce0e6;
  --acc:#0f62fe;--accfg:#ffffff;--logbg:#111318;--logfg:#d8f5e0;--err:#ff7b8a;--rx:#8fd3ff;--tx:#ffd98f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121418;--fg:#eef1f6;--mut:#9aa2b0;--card:#1b1f26;--line:#2d333f;--acc:#4589ff;--accfg:#0b1526;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);flex:1;min-height:44px;cursor:pointer}
button.main{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.subbtn{font-size:13px;padding:9px 10px}
button:disabled{opacity:.45;cursor:not-allowed}
#state{font-weight:700;margin:0 0 3px}
#hint{color:var(--mut);font-size:13px;margin:0}
input,select{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin-top:6px}
#log{background:var(--logbg);color:var(--logfg);font:12px/1.35 ui-monospace,Menlo,monospace;border-radius:10px;padding:8px;
  height:34vh;overflow:auto;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
#log .err{color:var(--err)}#log .rx{color:var(--rx)}#log .tx{color:var(--tx)}#log .ok{font-weight:700}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 8px}
[hidden]{display:none!important}
#view{width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:8px;image-rendering:pixelated}
#vid{width:100%;display:block;border-radius:8px;background:#000;margin-bottom:8px}
input[type=range]{padding:0;border:0;background:none}
.sl{display:block;margin-top:10px;font-size:13px}.sl b{float:right;font-weight:600}
#info{color:var(--mut);font-size:12px;margin:6px 0 0}
</style>
</head>
<body>
<h1>MXW01 Thermal Camera</h1>
<p class="sub">v5 · Accepted 0xA9 Modes + Paced Stream &amp; Completion Log</p>

<div class="card">
  <p id="state">Disconnected</p>
  <p id="hint">Force-close Fun Print first, then tap Connect.</p>
  <div class="row" style="margin-top:10px">
    <button id="btnConnect" class="main">Connect</button>
    <button id="btnDisc" disabled>Disconnect</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnStat" class="subbtn" disabled>Status (0xA1)</button>
    <button id="btnBatt" class="subbtn" disabled>Batt/Feed (0xA3)</button>
    <button id="btnProbe" class="subbtn" disabled>Probe 0xA9</button>
  </div>
</div>

<div class="card">
  <p class="label">1. Print Controls</p>
  <div class="row">
    <button id="btnPrint" class="main" disabled>Print Photo</button>
    <button id="btnTest" disabled>Print Test Strip</button>
  </div>
  <label class="sl">Thermal Intensity (0–255) <b id="inv"></b><input id="inten" type="range" min="10" max="255" value="140"></label>
  <label class="sl">Pacing Delay Between Chunks (ms) <b id="dlv"></b><input id="delay" type="range" min="0" max="60" step="5" value="15"></label>
  <details style="margin-top:10px" open><summary style="font-size:13px;font-weight:600">0xA9 Request &amp; Stream Overrides</summary>
    <label class="sl">0xA9 Payload Layout
      <select id="a9Layout">
        <option value="4byte_02" selected>4 bytes: [rowsLo, rowsHi, 0x02, 0x00] (Accepted [00])</option>
        <option value="4byte_01">4 bytes: [rowsLo, rowsHi, 0x01, 0x00] (Accepted [00])</option>
        <option value="2byte">2 bytes: [rowsLo, rowsHi] (Accepted [00])</option>
        <option value="4byte_00">4 bytes: [rowsLo, rowsHi, 0x00, 0x00] (Rejected [03])</option>
      </select>
    </label>
    <label class="sl">Chunk Size (bytes per write)
      <select id="chunk">
        <option value="48" selected>48 bytes (1 full scanline per write)</option>
        <option value="20">20 bytes (Safest for iOS / Bluefy BLE MTU)</option>
        <option value="96">96 bytes (2 scanlines per write)</option>
      </select>
    </label>
    <label class="sl">Bit Order
      <select id="bits">
        <option value="lsb" selected>LSB first</option>
        <option value="msb">MSB first</option>
      </select>
    </label>
    <label class="sl">Feed rows after image <input id="feed" type="number" value="60" min="0" max="200"></label>
  </details>
</div>

<div class="card">
  <p class="label">2. Camera &amp; Dithering</p>
  <video id="vid" playsinline muted autoplay hidden></video>
  <canvas id="view" width="384" height="240"></canvas>
  <p id="info">No photo yet.</p>
  <div class="row" style="margin-top:8px">
    <button id="btnLive" class="main">Live camera</button>
    <button id="btnShot" hidden>Take photo</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnCam">Camera app</button>
    <button id="btnLib">Library</button>
    <button id="btnRot">Rotate</button>
  </div>
  <input id="fCam" type="file" accept="image/*" capture="environment" hidden>
  <input id="fLib" type="file" accept="image/*" hidden>
  <select id="mode" aria-label="Render mode">
    <option value="atk">Dot: Atkinson (high contrast)</option>
    <option value="fs">Dot: Floyd-Steinberg (smooth)</option>
    <option value="stucki">Dot: Stucki (sharp, clean)</option>
    <option value="bayer">Dot: Bayer 8×8 (ordered, retro)</option>
    <option value="soft">Normal: soft threshold</option>
  </select>
  <label class="sl">Brightness <b id="brv"></b><input id="br" type="range" min="-100" max="100" value="0"></label>
  <label class="sl">Contrast <b id="ctv"></b><input id="ct" type="range" min="-100" max="100" value="15"></label>
  <label class="sl">Gamma <b id="gmv"></b><input id="gm" type="range" min="0.5" max="2.5" step="0.05" value="1"></label>
  <label class="sl">Threshold <b id="thv"></b><input id="th" type="range" min="0" max="255" value="128"></label>
  <label class="sl">Softness <b id="sfv"></b><input id="sf" type="range" min="0" max="100" value="60"></label>
</div>

<div class="card">
  <p class="label">3. Telemetry &amp; GATT Log</p>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="row" style="margin-top:8px">
    <button id="btnCopy">Copy log</button>
    <button id="btnClear">Clear</button>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, kind){
  const d = document.createElement('div');
  if(kind) d.className = kind;
  d.textContent = new Date().toISOString().slice(11,23) + ' ' + msg;
  logEl.appendChild(d);
  while(logEl.childNodes.length > 700) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
const hex = dv => Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength))
  .map(b => b.toString(16).padStart(2,'0')).join(' ');
const short = u => { u = String(u).toLowerCase(); return u.length === 4 ? u : u.slice(4,8); };
function errStr(e){ return e instanceof Error ? e.name+': '+e.message : String(e); }

/* ---------- BLE Connection ---------- */
const SERVICES = ['ae30','ae00','af30','ff00','ffe0','fff0','18f0','fee7','180a','180f']
  .map(s => '0000'+s+'-0000-1000-8000-00805f9b34fb');
const PROPS = ['read','write','writeWithoutResponse','notify','indicate'];
let dev = null, server = null, catChars = {}, printing = false;

function setState(connected, text){
  $('state').textContent = text || (connected ? 'Connected' : 'Disconnected');
  $('btnConnect').disabled = connected;
  $('btnDisc').disabled = !connected;
  updPrint();
}

async function connect(){
  if(!navigator.bluetooth){ log('Web Bluetooth unavailable in this browser.','err'); return; }
  try{
    log('Requesting BLE device…');
    dev = null;
    for(const [label, opts] of [
      ['all + optionalServices', {acceptAllDevices:true, optionalServices:SERVICES}],
      ['all, no services', {acceptAllDevices:true}]
    ]){
      try{ dev = await navigator.bluetooth.requestDevice(opts); break; }
      catch(e){ log('Attempt ('+label+'): '+errStr(e),'err'); if(e && e.name==='NotFoundError') throw e; }
    }
    if(!dev) throw new Error('Device selection failed');
    log('Selected: "'+(dev.name||'unnamed')+'"');
    dev.addEventListener('gattserverdisconnected', () => {
      log('GATT disconnected','err'); catChars = {}; setState(false);
    });
    setState(false,'Connecting…');
    server = await dev.gatt.connect();
    log('GATT connected','ok');
    await discover();
    setState(true,'Connected: '+(dev.name||'MXW01'));
  }catch(e){ log(errStr(e),'err'); setState(false); }
}

async function discover(){
  catChars = {};
  const services = await server.getPrimaryServices();
  for(const s of services){
    log('SERVICE '+short(s.uuid));
    const chars = await s.getCharacteristics();
    for(const c of chars){
      const p = PROPS.filter(k => c.properties[k]);
      log('  CHAR '+short(c.uuid)+' ['+p.join(',')+']');
      if(short(s.uuid) === 'ae30') catChars[short(c.uuid)] = c;
      if(c.properties.notify || c.properties.indicate){
        try{
          c.addEventListener('characteristicvaluechanged', ev => {
            log('RX '+short(c.uuid)+': '+hex(ev.target.value),'rx');
            onNotify(short(c.uuid), ev.target.value);
          });
          await c.startNotifications();
        }catch(e){ log('  Notify err '+short(c.uuid)+': '+e.message,'err'); }
      }
    }
  }
  log('Discovery done.','ok');
}

function disconnect(){ if(dev && dev.gatt.connected) dev.gatt.disconnect(); }

/* ---------- Image & Dithering Pipeline ---------- */
const W = 384;
const KERNELS = {
  fs:[[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]],
  atk:[[1,0,1/8],[2,0,1/8],[-1,1,1/8],[0,1,1/8],[1,1,1/8],[0,2,1/8]],
  stucki:[[1,0,8/42],[2,0,4/42],[-2,1,2/42],[-1,1,4/42],[0,1,8/42],[1,1,4/42],[2,1,2/42],[-2,2,1/42],[-1,2,2/42],[0,2,4/42],[1,2,2/42],[2,2,1/42]]
};
const BAYER = (() => {
  let m = [0], n = 1;
  while(n < 8){
    const nm = new Array(4*n*n);
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
      const v = m[y*n+x];
      nm[y*2*n+x] = 4*v; nm[y*2*n+x+n] = 4*v+2; nm[(y+n)*2*n+x] = 4*v+3; nm[(y+n)*2*n+x+n] = 4*v+1;
    }
    m = nm; n *= 2;
  }
  return m;
})();
const view = $('view'), vid = $('vid'), work = document.createElement('canvas');
let src = null, rot = 0, stream = null, last = null, raf = 0, lastUrl = null;
function schedule(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }

function blank(){
  view.width = W; view.height = 200;
  const c = view.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0,0,W,200);
  c.fillStyle = '#888'; c.font = '18px sans-serif'; c.textAlign = 'center';
  c.fillText('Tap Print Test Strip or load a photo', W/2, 105);
}

function draw(){
  ['br','ct','gm','th','sf'].forEach(k => { $(k+'v').textContent = $(k).value; });
  if(!src) return;
  const odd = rot % 2 === 1;
  const sw = odd ? src.h : src.w, sh = odd ? src.w : src.h;
  const H = Math.min(2000, Math.max(8, Math.round(W * sh / sw)));
  work.width = W; work.height = H;
  const c = work.getContext('2d', {willReadFrequently:true});
  c.fillStyle = '#fff'; c.fillRect(0,0,W,H);
  c.save(); c.translate(W/2, H/2); c.rotate(rot * Math.PI / 2);
  const dw = odd ? H : W, dh = odd ? W : H;
  c.drawImage(src.el, -dw/2, -dh/2, dw, dh);
  c.restore();
  const id = c.getImageData(0,0,W,H), d = id.data, g = new Float32Array(W*H);
  const br = +$('br').value * 2.55, ct = +$('ct').value * 2.55, gm = +$('gm').value, t = +$('th').value;
  const cf = (259 * (ct + 255)) / (255 * (259 - ct));
  for(let i = 0, j = 0; i < g.length; i++, j += 4){
    let v = 0.299*d[j] + 0.587*d[j+1] + 0.114*d[j+2] + br;
    v = cf * (v - 128) + 128;
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    g[i] = 255 * Math.pow(v / 255, 1 / gm);
  }
  const mono = new Uint8Array(W*H), mode = $('mode').value, K = KERNELS[mode];
  const band = 8 + (+$('sf').value) * 1.2;
  const add = (x,y,e) => { if(x >= 0 && x < W && y < H) g[y*W+x] += e; };
  for(let y = 0; y < H; y++){
    for(let x = 0; x < W; x++){
      const i = y*W + x, old = g[i];
      if(mode === 'soft'){
        let sv = (old - (t - band)) / (2*band); sv = sv < 0 ? 0 : sv > 1 ? 1 : sv; sv = sv*sv*(3 - 2*sv);
        const n = (52.9829189 * ((0.06711056*x + 0.00583715*y) % 1)) % 1;
        mono[i] = sv > n ? 0 : 1; continue;
      }
      if(mode === 'bayer'){ mono[i] = old < (BAYER[(y&7)*8 + (x&7)] + 0.5) * 3.984375 + (t - 128) ? 1 : 0; continue; }
      const nw = old < t ? 0 : 255, e = old - nw;
      mono[i] = nw === 0 ? 1 : 0;
      for(const k of K) add(x+k[0], y+k[1], e*k[2]);
    }
  }
  for(let i = 0, j = 0; i < mono.length; i++, j += 4){ const v = mono[i] ? 0 : 255; d[j] = d[j+1] = d[j+2] = v; d[j+3] = 255; }
  view.width = W; view.height = H;
  view.getContext('2d').putImageData(id, 0, 0);
  last = {mono, w:W, h:H};
  updPrint();
  $('info').textContent = 'Print size: '+W+' × '+H+' px (rotation '+(rot*90)+'°)';
}

function stopCam(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  vid.srcObject = null; vid.hidden = true; view.hidden = false;
  $('btnShot').hidden = true; $('btnLive').textContent = 'Live camera';
}
async function startCam(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    log('Live camera needs HTTPS. Use Camera app or Library.','err'); return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:960}}, audio:false});
    vid.srcObject = stream; await vid.play();
    vid.hidden = false; view.hidden = true; $('btnShot').hidden = false; $('btnLive').textContent = 'Stop camera';
  }catch(e){ log('Camera failed: '+errStr(e),'err'); stopCam(); }
}
function shot(){
  const w = vid.videoWidth, h = vid.videoHeight; if(!w) return;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(vid,0,0);
  src = {el:c, w, h}; rot = 0; stopCam(); draw();
}
async function loadFile(f){
  if(!f) return;
  try{
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(f);
    const im = new Image(); im.src = lastUrl; await im.decode();
    src = {el:im, w:im.naturalWidth, h:im.naturalHeight}; rot = 0; stopCam(); draw();
  }catch(e){ log('Image load failed: '+errStr(e),'err'); }
}

$('btnLive').addEventListener('click', () => stream ? stopCam() : startCam());
$('btnShot').addEventListener('click', shot);
$('btnCam').addEventListener('click', () => $('fCam').click());
$('btnLib').addEventListener('click', () => $('fLib').click());
$('btnRot').addEventListener('click', () => { rot = (rot + 1) % 4; schedule(); });
['fCam','fLib'].forEach(id => $(id).addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; }));
['mode','br','ct','gm','th','sf'].forEach(id => $(id).addEventListener('input', schedule));
blank(); draw();

/* ---------- MXW01 Protocol Engine ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));

const CRC8_TABLE = new Uint8Array([
  0x00,0x31,0x62,0x53,0xc4,0xf5,0xa6,0x97,0xb9,0x88,0xdb,0xea,0x7d,0x4c,0x1f,0x2e,
  0x43,0x72,0x21,0x10,0x87,0xb6,0xe5,0xd4,0xfa,0xcb,0x98,0xa9,0x3e,0x0f,0x5c,0x6d,
  0x86,0xb7,0xe4,0xd5,0x42,0x73,0x20,0x11,0x3f,0x0e,0x5d,0x6c,0xfb,0xca,0x99,0xa8,
  0xc5,0xf4,0xa7,0x96,0x01,0x30,0x63,0x52,0x7c,0x4d,0x1e,0x2f,0xb8,0x89,0xda,0xeb,
  0x3d,0x0c,0x5f,0x6e,0xf9,0xc8,0x9b,0xaa,0x84,0xb5,0xe6,0xd7,0x40,0x71,0x22,0x13,
  0x7e,0x4f,0x1c,0x2d,0xba,0x8b,0xd8,0xe9,0xc7,0xf6,0xa5,0x94,0x03,0x32,0x61,0x50,
  0xbb,0x8a,0xd9,0xe8,0x7f,0x4e,0x1d,0x2c,0x02,0x33,0x60,0x51,0xc6,0xf7,0xa4,0x95,
  0xf8,0xc9,0x9a,0xab,0x3c,0x0d,0x5e,0x6f,0x41,0x70,0x23,0x12,0x85,0xb4,0xe7,0xd6,
  0x7a,0x4b,0x18,0x29,0xbe,0x8f,0xdc,0xed,0xc3,0xf2,0xa1,0x90,0x07,0x36,0x65,0x54,
  0x39,0x08,0x5b,0x6a,0xfd,0xcc,0x9f,0xae,0x80,0xb1,0xe2,0xd3,0x44,0x75,0x26,0x17,
  0xfc,0xcd,0x9e,0xaf,0x38,0x09,0x5a,0x6b,0x45,0x74,0x27,0x16,0x81,0xb0,0xe3,0xd2,
  0xbf,0x8e,0xdd,0xec,0x7b,0x4a,0x19,0x28,0x06,0x37,0x64,0x55,0xc2,0xf3,0xa0,0x91,
  0x47,0x76,0x25,0x14,0x83,0xb2,0xe1,0xd0,0xfe,0xcf,0x9c,0xad,0x3a,0x0b,0x58,0x69,
  0x04,0x35,0x66,0x57,0xc0,0xf1,0xa2,0x93,0xbd,0x8c,0xdf,0xee,0x79,0x48,0x1b,0x2a,
  0xc1,0xf0,0xa3,0x92,0x05,0x34,0x67,0x56,0x78,0x49,0x1a,0x2b,0xbc,0x8d,0xde,0xef,
  0x82,0xb3,0xe0,0xd1,0x46,0x77,0x24,0x15,0x3b,0x0a,0x59,0x68,0xff,0xce,0x9d,0xac
]);

function crc8(arr){
  let c = 0;
  for(let i = 0; i < arr.length; i++) c = CRC8_TABLE[(c ^ arr[i]) & 0xff];
  return c;
}

function makePacket(cmd, payload){
  const p = Uint8Array.from(payload);
  const len = p.length;
  const out = new Uint8Array(8 + len);
  out[0] = 0x22;
  out[1] = 0x21;
  out[2] = cmd;
  out[3] = 0x00;
  out[4] = len & 0xff;
  out[5] = (len >> 8) & 0xff;
  out.set(p, 6);
  out[6 + len] = crc8(p);
  out[7 + len] = 0xff;
  return out;
}

async function bleWrite(ch, bytes){
  if(ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse){
    await ch.writeValueWithoutResponse(bytes);
  } else {
    await ch.writeValue(bytes);
  }
}

let waiters = [];
function onNotify(id, dv){
  const b = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  if(b.length < 8 || b[0] !== 0x22 || b[1] !== 0x21) return;
  const cmd = b[2], n = b[4] | (b[5] << 8);
  const pl = b.subarray(6, 6+n);
  log('  NOTIFY ['+id+'] cmd=0x'+cmd.toString(16)+' payload=['+hex(pl)+']','ok');
  waiters = waiters.filter(w => { if(w.cmd === cmd){ w.res(b); return false; } return true; });
}

function waitCmd(cmd, ms){
  return new Promise(res => {
    const w = {cmd, res}; waiters.push(w);
    setTimeout(() => { if(waiters.includes(w)){ waiters = waiters.filter(x => x !== w); res(null); } }, ms);
  });
}

function buildA9Payload(totalRows, layout){
  const lo = totalRows & 0xff, hi = (totalRows >> 8) & 0xff;
  if(layout === '2byte') return [lo, hi];
  if(layout === '4byte_02') return [lo, hi, 0x02, 0x00];
  if(layout === '4byte_01') return [lo, hi, 0x01, 0x00];
  return [lo, hi, 0x00, 0x00];
}

function packRows(mono, w, h, lsb, totalRows){
  const rb = w >> 3, out = new Uint8Array(rb * totalRows);
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      if(mono[y * w + x]){
        out[y * rb + (x >> 3)] |= lsb ? (1 << (x & 7)) : (0x80 >> (x & 7));
      }
    }
  }
  return out;
}

function makeTestStrip(){
  const w = 384, h = 150, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, 24);
  ctx.fillRect(0, h-16, w, 16);
  ctx.fillRect(0, 0, 12, h);
  ctx.fillRect(w-12, 0, 12, h);
  ctx.font = 'bold 48px monospace'; ctx.textBaseline = 'top';
  ctx.fillText('F MXW01 V5', 24, 34);
  ctx.font = 'bold 24px monospace';
  ctx.fillText('|||| 1234567890 ||||', 24, 96);
  const d = ctx.getImageData(0,0,w,h).data, m = new Uint8Array(w*h);
  for(let i = 0; i < m.length; i++) m[i] = d[i*4] < 128 ? 1 : 0;
  return {mono:m, w, h};
}

async function printMXW01(img){
  const c1 = catChars.ae01, c3 = catChars.ae03;
  if(!(dev && dev.gatt.connected && c1 && c3)) throw new Error('Printer not connected (need ae01 + ae03)');

  const feedRows = Math.max(0, +$('feed').value | 0);
  const totalRows = Math.max(90, img.h + feedRows);
  const lsb = $('bits').value === 'lsb';
  const layout = $('a9Layout').value;
  const chunk = Math.max(20, +$('chunk').value | 0);
  const delay = Math.max(0, +$('delay').value | 0);
  const intensity = +$('inten').value & 0xff;

  const data = packRows(img.mono, img.w, img.h, lsb, totalRows);

  const sendCmd = async (cmd, payload) => {
    const p = makePacket(cmd, payload);
    log('TX ae01: '+hex(p),'tx');
    await bleWrite(c1, p);
  };

  log('=== MXW01 V5 PRINT ('+layout+', '+totalRows+' rows, '+data.length+' B, '+chunk+'B/'+delay+'ms) ===');

  await sendCmd(0xA2, [intensity]);
  await sleep(60);

  const a9Pl = buildA9Payload(totalRows, layout);
  const ackA9 = waitCmd(0xA9, 3000);
  await sendCmd(0xA9, a9Pl);
  const resA9 = await ackA9;
  if(resA9){
    const st = resA9[6];
    if(st !== 0x00) log('0xA9 status = 0x'+st.toString(16),'err');
  } else {
    log('No 0xA9 ACK within 3s — continuing…','err');
  }
  await sleep(60);

  for(let offset = 0; offset < data.length; offset += chunk){
    const slice = data.subarray(offset, offset + chunk);
    await bleWrite(c3, slice);
    if(delay > 0) await sleep(delay);
  }
  log('Bitmap stream complete ('+data.length+' bytes)','ok');

  await sleep(120);
  const ackAA = waitCmd(0xAA, 25000);
  await sendCmd(0xAD, [0x00]);
  log((await ackAA) ? 'PRINT COMPLETE (0xAA received)!' : 'Finished (no 0xAA within 25s).','ok');
}

function updPrint(){
  const ok = !!(dev && dev.gatt && dev.gatt.connected && catChars.ae01 && catChars.ae03) && !printing;
  $('btnPrint').disabled = !ok || !last;
  $('btnTest').disabled = !ok;
  $('btnStat').disabled = !ok;
  $('btnBatt').disabled = !ok;
  $('btnProbe').disabled = !ok;
}

async function execJob(fn){
  if(printing) return;
  printing = true; updPrint();
  try{ await fn(); }
  catch(e){ log('Error: '+errStr(e),'err'); }
  printing = false; updPrint();
}

$('btnPrint').addEventListener('click', () => last && execJob(() => printMXW01(last)));
$('btnTest').addEventListener('click', () => execJob(() => printMXW01(makeTestStrip())));
$('btnStat').addEventListener('click', () => execJob(async () => {
  const w = waitCmd(0xA1, 2500), p = makePacket(0xA1, [0x00]);
  log('TX ae01 (Status 0xA1): '+hex(p),'tx'); await bleWrite(catChars.ae01, p);
  if(!(await w)) log('No 0xA1 reply in 2.5s','err');
}));
$('btnBatt').addEventListener('click', () => execJob(async () => {
  const w = waitCmd(0xA3, 2500), p = makePacket(0xA3, [0x00]);
  log('TX ae01 (Batt/Feed 0xA3): '+hex(p),'tx'); await bleWrite(catChars.ae01, p);
  if(!(await w)) log('No 0xA3 reply in 2.5s','err');
}));
$('btnProbe').addEventListener('click', () => execJob(async () => {
  const layouts = ['2byte','4byte_00','4byte_02','4byte_01'];
  log('=== Probing 0xA9 payloads for 120 rows ===');
  for(const l of layouts){
    const pl = buildA9Payload(120, l);
    const p = makePacket(0xA9, pl);
    const w = waitCmd(0xA9, 1500);
    log('TX 0xA9 ['+l+']: '+hex(p),'tx');
    await bleWrite(catChars.ae01, p);
    const r = await w;
    if(!r) log('  -> no 0xA9 response in 1.5s','err');
    await sleep(250);
  }
}));

$('inten').addEventListener('input', () => { $('inv').textContent = $('inten').value; });
$('delay').addEventListener('input', () => { $('dlv').textContent = $('delay').value + 'ms'; });
$('inv').textContent = $('inten').value;
$('dlv').textContent = $('delay').value + 'ms';

$('btnConnect').addEventListener('click', connect);
$('btnDisc').addEventListener('click', disconnect);
$('btnCopy').addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText(logEl.innerText); log('Log copied.','ok'); }
  catch(e){
    const r = document.createRange(); r.selectNodeContents(logEl);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    log('Log selected — tap Copy in iOS menu.','err');
  }
});
$('btnClear').addEventListener('click', () => { logEl.textContent = ''; });

log('MXW01 v5 ready. Secure:'+window.isSecureContext+' | BLE:'+!!navigator.bluetooth);
</script>
